[package]
name = "rl-widget"
version = "0.2.1"
edition = "2021"
description = "RL Toolkit per-plugin overlay widget"
license = "MIT"
publish = false

[[bin]]
name = "rl-widget"
path = "src/main.rs"

[[example]]
name = "fake_backend"
path = "tests/fixtures/fake_backend.rs"

[lib]
name = "rl_widget"
path = "src/lib.rs"

[features]
# Enabled for the auto-updating bundles (Windows NSIS installer,
# Linux AppImage). Off for portable builds (Windows .zip, Linux
# .tar.gz) because tauri-plugin-updater's setup deserializes Config
# eagerly and aborts the launcher when the config block is absent —
# the plugin can't simply be left "configured but inactive."
bundled-updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
dirs = "6"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
url = "2"

# Linux-only: layer-shell so the widget lives on the overlay layer
# (above normal windows, anchored, click-through).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = "0.8"
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Windows-only: DWM + window-style bindings for the no-border pass on
# the overlay window. Win11 paints a 1px frame around transparent
# always-on-top windows that survives decorations(false); we suppress
# it through DWMWA_BORDER_COLOR, DWMWA_WINDOW_CORNER_PREFERENCE,
# DWMWA_NCRENDERING_POLICY, and by stripping WS_THICKFRAME.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSRunningApplication",
] }
objc2-foundation = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
