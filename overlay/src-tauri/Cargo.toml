[package]
name = "rl-widget"
version = "0.1.0"
edition = "2021"
description = "RL Toolkit per-plugin overlay widget"
license = "MIT"
publish = false

[[bin]]
name = "rl-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
url = "2"

# Linux-only: layer-shell so the widget lives on the overlay layer
# (above normal windows, anchored, click-through).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = "0.8"
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Windows-only: DWM + window-style bindings for the no-border pass on
# the overlay window. Win11 paints a 1px frame around transparent
# always-on-top windows that survives decorations(false); we suppress
# it through DWMWA_BORDER_COLOR, DWMWA_WINDOW_CORNER_PREFERENCE,
# DWMWA_NCRENDERING_POLICY, and by stripping WS_THICKFRAME.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
