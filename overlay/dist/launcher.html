<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RL Toolkit</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <header id="strip">
    <div id="brand">RL</div>

    <span id="conn" class="conn" data-status="connecting">connecting…</span>
    <span id="ownership-badge" class="badge" hidden>external</span>

    <span class="spacer"></span>

    <label class="switch">
      <input type="checkbox" id="overlay-toggle" />
      <span class="track"></span>
      <span class="label">Overlay</span>
    </label>

    <details id="overflow">
      <summary>⋯</summary>
      <ul>
        <li><button data-cmd="toggle_backend" id="toggle-backend-btn">Stop backend</button></li>
        <li><button data-cmd="restart_backend" id="restart-btn">Restart backend</button></li>
        <li><button data-cmd="open_data_folder">Open data folder</button></li>
        <li><button data-cmd="open_dashboard_in_browser">Open in browser</button></li>
        <li><button data-cmd="open_settings" id="settings-btn">Settings</button></li>
        <li class="sep"></li>
        <li><button data-cmd="quit">Quit</button></li>
      </ul>
    </details>
  </header>

  <main id="body">
    <div id="tray-banner" class="banner" hidden>
      Tray unavailable — closing this window will quit the app.
    </div>
    <iframe id="dashboard" src="about:blank"></iframe>
    <div id="fallback" class="fallback" hidden>
      <div class="msg" id="fallback-msg">Starting backend…</div>
      <button id="fallback-retry" hidden>Retry</button>
    </div>
  </main>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2>Settings</h2>
      <div class="field">
        <label for="plugins-dir">Plugins directory</label>
        <div class="path-input">
          <input type="text" id="plugins-dir" placeholder="./plugins (default)">
          <button type="button" data-pick="plugins-dir">Browse…</button>
        </div>
      </div>
      <div class="field">
        <label for="data-dir">Data directory</label>
        <div class="path-input">
          <input type="text" id="data-dir" placeholder="./data (default)">
          <button type="button" data-pick="data-dir">Browse…</button>
        </div>
      </div>
      <div class="field">
        <label for="rl-addr">Rocket League Stats API address</label>
        <div class="path-input">
          <input type="text" id="rl-addr" placeholder="127.0.0.1:49123 (default)">
        </div>
      </div>
      <p class="hint" id="settings-hint" hidden></p>
      <div class="modal-actions">
        <button id="settings-cancel" class="btn-secondary">Cancel</button>
        <button id="settings-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="launcher.js" defer></script>
</body>
</html>
