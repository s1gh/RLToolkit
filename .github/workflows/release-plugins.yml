# Packages every plugin under plugins/ into a .rltp, generates a
# schema-1 plugins.json, and uploads the lot to the long-lived
# `plugins-latest` GitHub release. The launcher fetches plugins.json
# from this release and surfaces "update available" pills.
#
# Plugins that should NOT ship to users can place a top-level
# .norelease file in their folder; the loop below skips them.

name: release-plugins

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Build SDK bundle (esbuild)
        # backend/internal/server/assets.go embeds web/sdk/dist/sdk.js;
        # the dist file is gitignored and built fresh per run.
        run: |
          npm install
          make sdk

      - name: Build rl-toolkit
        run: go build -o ./bin/rl-toolkit ./backend/cmd/rl-toolkit

      - name: Build gen-plugin-catalog
        run: go build -o ./bin/gen-plugin-catalog ./backend/cmd/gen-plugin-catalog

      - name: Pack every plugin (skipping .norelease)
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/.norelease" ]; then
              echo "Skipping $name (.norelease)"; continue
            fi
            if [ ! -f "$dir/manifest.json" ]; then
              echo "Skipping $name (no manifest.json)"; continue
            fi
            ./bin/rl-toolkit pack "$dir" -out dist/
          done
          ls -la dist/

      - name: Ensure plugins-latest release exists
        # Created (and re-asserted) with --latest=false so this rolling
        # release never claims GitHub's /releases/latest/ alias. The app
        # updater fetches latest.json via that alias from the v<X.Y.Z>
        # app release; if plugins-latest steals the alias the updater
        # gets a 404 and silently logs "Could not fetch a valid release
        # JSON from the remote".
        run: |
          if ! gh release view plugins-latest >/dev/null 2>&1; then
            gh release create plugins-latest \
              --title "Latest plugin catalog" \
              --notes "Rolling release of packaged plugins. Updated by the release-plugins workflow." \
              --latest=false
          fi
          gh release edit plugins-latest --latest=false

      - name: Remove stale .rltp assets from plugins-latest
        run: |
          gh release view plugins-latest --json assets -q '.assets[].name' \
            | grep '\.rltp$' \
            | while read -r asset; do
                echo "Deleting $asset"
                gh release delete-asset plugins-latest "$asset" --yes
              done

      - name: Generate plugins.json
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          BASE="https://github.com/${OWNER}/${REPO}/releases/download/plugins-latest/"
          ./bin/gen-plugin-catalog -in dist -base-url "$BASE" -out dist/plugins.json
          cat dist/plugins.json

      - name: Upload assets to plugins-latest (clobber)
        run: |
          gh release upload plugins-latest dist/*.rltp dist/plugins.json --clobber
