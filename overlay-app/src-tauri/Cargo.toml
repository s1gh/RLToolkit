[package]
name = "rl-widget"
version = "0.1.0"
edition = "2021"
description = "RL Toolkit per-plugin overlay widget"
license = "MIT"
publish = false

[[bin]]
name = "rl-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
url = "2"

# Linux-only: layer-shell so the widget lives on the overlay layer
# (above normal windows, anchored, click-through).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = "0.8"

# Windows-only: DWM bindings so we can disable the Win11 window border
# (DWMWA_BORDER_COLOR = DWMWA_COLOR_NONE). Without this, transparent
# always-on-top decoration-less windows still get a 1px frame outlined
# by the Win11 compositor — visible against the desktop.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
