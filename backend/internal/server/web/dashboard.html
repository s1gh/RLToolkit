<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RL Toolkit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<style>
/* Self-hosted fonts (woff2 served from /fonts/, embedded into the
   backend binary). Previously this page pulled Inter / Inter Tight /
   JetBrains Mono from fonts.googleapis.com with display=swap, so the
   first paint rendered text in the system fallback and reflowed
   noticeably the moment the web fonts arrived. The visible artifact
   was the "Browser sources / Plugins" headings flashing on launcher
   open. Self-hosting kills the network round-trip; the woff2s are
   part of the embedded asset bundle and are ready by the time the
   HTML parser gets here.

   font-display:block pairs with the document.fonts.ready gate at the
   bottom of this file: the shell stays hidden until the fonts are
   ready, so the user never sees the FOIT period this would normally
   cause.

   `latin` covers ASCII; `latin-ext` covers accented Western European
   so player names render correctly. Cyrillic / Greek / Vietnamese
   subsets are intentionally omitted to keep the bundle small. The
   system fallback still renders those characters readably.

   Inter and Inter Tight are variable fonts: one woff2 per subset
   covers the full weight range we declare. JetBrains Mono is the
   same. One file per subset, weights 400 to 600. */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 800;
  font-display: block;
  src: url('/fonts/inter-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 800;
  font-display: block;
  src: url('/fonts/inter-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Inter Tight';
  font-style: normal;
  font-weight: 500 800;
  font-display: block;
  src: url('/fonts/inter-tight-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter Tight';
  font-style: normal;
  font-weight: 500 800;
  font-display: block;
  src: url('/fonts/inter-tight-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root {
  /* Surfaces */
  --bg-0:#08090f; --bg-1:#0f1117; --bg-2:#161922; --bg-3:#1f232f;
  --line:#252938; --line-2:#363b4d;

  /* Text */
  --txt:#e9ecf2; --txt-2:#a6abbf; --txt-3:#6c7286;

  /* Accents */
  --cyan:#22d3ee;   --cyan-glow:rgba(34,211,238,0.35);
  --violet:#a78bfa; --violet-glow:rgba(167,139,250,0.35);
  --green:#22c55e;
  --gold:#fbbf24;
  --rose:#f472b6;

  /* Type */
  --display:'Inter Tight', system-ui, sans-serif;
  --ui:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
/* Hide the shell until fonts are ready and the first plugin fetch has
   resolved. Without this gate the dashboard paints Browser sources
   immediately (synchronous render) and the Plugins grid pops in once
   the /api/plugins fetch lands, which the user sees as a flash. The
   .ready class is set on <html> by the inline script at the bottom of
   the page once both conditions hold, with a watchdog timeout so a
   stalled fetch can't leave the shell hidden indefinitely. */
html:not(.ready) .shell{ visibility:hidden; }
/* html stays at full viewport height so the radial-gradient anchor
   percentages (`-10%`, `110%`) resolve consistently. body uses
   min-height instead of height — locking body to 100% would clip
   the background to the viewport, leaving the scrolled-into area
   (plugin grid below the fold when the launcher window is small)
   showing the underlying iframe color, not the dashboard's. */
/* Paint the dark surface on <html> as well as <body>. Without this
   the webview briefly shows its default white canvas between mount
   and the first body paint, which the user sees as a flash before
   the dashboard fades in. */
html{ height:100%; background:var(--bg-0); }
body{
  font-family:var(--ui); font-size:14px; color:var(--txt);
  background:
    radial-gradient(1400px 700px at 85% -10%, rgba(167,139,250,0.10), transparent 60%),
    radial-gradient(1100px 550px at -10% 110%, rgba(34,211,238,0.07), transparent 60%),
    var(--bg-0);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  letter-spacing:-0.005em;
}
/* Embedded inside the launcher: feel like a desktop app, not a web
   page. Text isn't selectable, the cursor is the default arrow.
   Form inputs still allow text selection so users can type. The
   marker class is set on <html> by the inline script below.
   Standalone browser tabs (no marker) keep native selection. */
html.in-launcher,
html.in-launcher body{
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}
html.in-launcher input,
html.in-launcher textarea{
  user-select:text;
  -webkit-user-select:text;
  cursor:text;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ─── Layout ───────────────────────────────────────────────── */
/* Shell width caps the content so prose doesn't get a luxurious
   line length on ultrawide displays, but stays roomy enough that the
   plugin grid (auto-fill minmax(320px, 1fr)) reaches 4 columns at
   fullscreen on a 1440p+ monitor. Tightening to 1280px (the previous
   value) left a ~600px empty band on each side at 2560-wide. */
.shell{
  max-width:1600px; margin:0 auto;
  padding:24px 32px 40px;
}
@media (max-width:720px){ .shell{ padding:20px 18px 32px; } }

/* ─── Topbar ───────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 4px 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand .logo{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  box-shadow: 0 8px 24px -8px var(--violet-glow);
}
.brand h1{
  font-family:var(--display); font-weight:800;
  font-size:22px; letter-spacing:-0.025em; line-height:1;
  color:#fff;
}
.brand .tag{
  font-size:12px; color:var(--txt-3);
  margin-top:3px; letter-spacing:0;
}


/* ─── Section heading ──────────────────────────────────────── */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 4px 4px 16px;
}
.section-head h2{
  font-family:var(--display); font-weight:600;
  font-size:18px; letter-spacing:-0.015em; line-height:1;
  color:var(--txt);
}
.section-head .count{
  font-family:var(--mono); font-size:12px;
  color:var(--txt-3);
  font-feature-settings:'tnum';
}
.section-head-left{
  display:flex; align-items:baseline; gap:10px;
}
.section-head-right{
  display:flex; align-items:center; gap:12px;
}
.section-head-right .btn{ flex:0 0 auto; white-space:nowrap; }
.section-head-right .btn[hidden]{ display:none; }

/* ─── Plugin grid ──────────────────────────────────────────── */
.plugins{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap:14px;
  margin-bottom:48px;
}

.card{
  position:relative;
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2) 110%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 22px 18px;
  display:flex; flex-direction:column; gap:14px;
  min-height:200px;
  overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(360px 200px at 100% 0%, rgba(167,139,250,0.08), transparent 60%);
  opacity:0; transition:opacity .25s ease;
  pointer-events:none;
}
.card::after{
  content:''; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
  opacity:0; transition:opacity .25s ease;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--line-2);
  box-shadow:0 24px 48px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(167,139,250,.12);
}
.card:hover::before, .card:hover::after{ opacity:1; }

.card-head{ display:flex; align-items:center; gap:12px; }
.card-icon{
  width:44px; height:44px; border-radius:11px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  flex-shrink:0;
}
.card-meta{ flex:1; min-width:0; }
.card-title{
  font-family:var(--display); font-weight:700;
  font-size:18px; letter-spacing:-0.015em; line-height:1.2;
  color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-sub{
  display:flex; align-items:center; gap:8px;
  margin-top:4px;
  font-size:12px; color:var(--txt-3);
}
.card-sub .v{
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:0.06em;
  background:var(--bg-3); border:1px solid var(--line);
  padding:2px 8px; border-radius:99px;
  color:var(--txt-2);
}
.card-sub .author{
  font-family:var(--mono); color:var(--txt-3);
}
.card-sub .update-pill{
  display:inline-flex; align-items:center; gap:.25em;
  margin-left:.5em; padding:.1em .55em;
  font: inherit; font-size:11px; font-weight:600; line-height:1.4;
  color:#1d1300; background:#ffc857;
  border:none; border-radius:999px; cursor:pointer;
  transition:filter .12s;
}
.card-sub .update-pill:hover{ filter:brightness(1.07); }
.card-sub .update-pill:disabled{ opacity:.6; cursor:default; }
.btn.update-all{ background:#ffc857; color:#1d1300; border-color:#ffc857; }
.btn.update-all:hover{ background:#ffd166; color:#1d1300; border-color:#ffd166; }
.btn.update-all:disabled{ opacity:.6; cursor:default; }
.section-head-right .catalog-error{
  font-size:11px; color:var(--txt-3); cursor:pointer; user-select:none;
  text-decoration:underline; text-decoration-style:dotted;
}

.card-desc{
  font-size:13px; line-height:1.55;
  color:var(--txt-2);
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* Right-align the action buttons. With Open present its flex:1 fills
   the row and the icons land on the right anyway; without Open the
   icons would otherwise float to the left edge of an otherwise empty
   row. justify-content makes the layout consistent across both. */
.card-actions{ display:flex; gap:6px; justify-content:flex-end; }
.btn{
  flex:1;
  font-family:var(--ui); font-size:12px; font-weight:600;
  letter-spacing:0;
  padding:10px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg-3); color:var(--txt);
  cursor:pointer;
  /* Explicit list — hover variants flip border-color, color, filter,
     and box-shadow. `transition: all` would force a watch on every
     property even though only these change. */
  transition:
    border-color .15s ease,
    color .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.btn.primary{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  color:var(--bg-0); border-color:transparent; font-weight:700;
}
.btn.primary:hover{
  filter:brightness(1.08);
  box-shadow:0 8px 24px -8px var(--cyan-glow), 0 8px 24px -8px var(--violet-glow);
  color:var(--bg-0);
}
.btn .arrow{ font-size:11px; transition:transform .2s ease; }
.btn.primary:hover .arrow{ transform:translateX(2px); }
/* Square icon button — opts out of the row's flex:1 stretch so the
   gear sits as a fixed-size secondary action next to the wide Open
   button. Explicit width AND height so the icons stay square whether
   they sit next to the Open button (which would otherwise stretch
   them via align-items:stretch) or alone in a row without Open.
   Disabled state signals "this plugin has no settings panel" without
   hiding the affordance, so users learn where settings live. */
.btn.icon{
  flex:0 0 auto;
  width:38px; height:38px; padding:0;
  color:var(--txt-2);
}
.btn.icon svg{ width:16px; height:16px; display:block; }
.btn:disabled{
  cursor:not-allowed;
  opacity:0.4;
}
.btn:disabled:hover{ border-color:var(--line); color:var(--txt-2); }

/* ─── Per-plugin toggle ────────────────────────────────────── */
/* Toggle in the card head, opposite the icon. Visually obvious so
   the user can see which plugins are active at a glance. The card
   itself dims to ~60% when disabled so the inactive set reads
   instantly across a long list. */
.card.disabled{ opacity:0.6; }
.card.disabled .card-icon{ filter:grayscale(0.7); }
.card-head{ position:relative; }
.toggle{
  position:absolute; top:0; right:0;
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; color:var(--txt-3);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600;
  cursor:pointer; user-select:none;
}
.toggle input{ position:absolute; opacity:0; pointer-events:none; }
.toggle .knob{
  width:32px; height:18px; background:var(--bg-3);
  border:1px solid var(--line); border-radius:99px;
  position:relative;
  transition:
    background .15s ease,
    border-color .15s ease;
}
.toggle .knob::after{
  content:''; position:absolute; top:1px; left:1px;
  width:14px; height:14px; border-radius:50%;
  background:var(--txt-3);
  transition:
    left .15s ease,
    background .15s ease;
}
.toggle input:checked + .knob{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  border-color:transparent;
}
.toggle input:checked + .knob::after{
  left:15px; background:var(--bg-0);
}

/* ─── Empty state ──────────────────────────────────────────── */
.empty{
  grid-column:1 / -1;
  background:var(--bg-1); border:1px dashed var(--line-2);
  border-radius:14px;
  padding:48px 32px; text-align:center;
}
.empty .em-icon{
  width:48px; height:48px; margin:0 auto 14px;
  border-radius:12px;
  background:var(--bg-3); border:1px solid var(--line);
  display:grid; place-items:center;
  font-size:22px; color:var(--txt-3);
}
.empty h3{
  font-family:var(--display); font-weight:700; font-size:18px;
  letter-spacing:-0.015em; color:#fff; margin-bottom:6px;
}
.empty p{ color:var(--txt-3); font-size:13px; max-width:380px; margin:0 auto; line-height:1.55; }
.empty code{
  font-family:var(--mono); font-size:12px;
  color:var(--cyan);
  background:var(--bg-3); padding:1px 6px; border-radius:4px;
}

/* ─── Browser sources ──────────────────────────────────────── */
/* Two fixed columns at typical launcher widths, collapsing to one
   below the dashboard's mobile breakpoint. Earlier this used an
   auto-fill minmax grid like the plugin grid — but with only two
   source cards, auto-fill would reserve extra empty tracks at wide
   widths, pinning each card to its min size while empty space sat
   beside them. The visible artifact was a "reflow" where the cards
   appeared to shrink as the window grew. A fixed two-column track
   keeps both cards stretched evenly across the available width at
   every step above the breakpoint. */
.sources{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:48px;
}
@media (max-width:720px){
  .sources{ grid-template-columns:1fr; }
}
.source-card{
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2) 110%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 20px 16px;
  display:flex; flex-direction:column; gap:10px;
}
.source-card .source-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:10px;
}
.source-card .source-title{
  font-size:13px; font-weight:600; color:var(--txt);
  letter-spacing:-0.01em;
}
.source-card .source-hint{
  font-size:11px; color:var(--txt-3);
}
.source-card .source-url{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px;
  background:var(--bg-0);
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--mono); font-size:12px;
  color:var(--txt-2);
  /* Long URLs shouldn't push the buttons out — let the URL ellipsize. */
  min-width:0;
}
.source-card .source-url-text{
  flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  user-select:all; /* triple-click selects the whole URL */
}
.source-card .source-actions{
  display:flex; gap:6px;
}
.source-card .source-btn{
  background:var(--bg-3); color:var(--txt-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:5px 10px;
  font:600 11px var(--ui);
  letter-spacing:0.04em;
  cursor:pointer;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.source-card .source-btn:hover{
  border-color:var(--cyan); color:var(--cyan);
}
.source-card .source-btn.copied{
  border-color:var(--cyan); color:var(--cyan); background:rgba(34,211,238,0.08);
}

/* ─── Developer endpoints ──────────────────────────────────── */
/* Collapsed by default. The summary reads as a quiet inline link
   so end users don't think it's something they need. The body
   reuses the .dot pill chrome the old footer ribbon had — these
   really are diagnostic, not branded launcher features. */
.dev-footer{
  border-top:1px solid var(--line);
  padding-top:14px; margin-top:8px;
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:16px;
}
.dev-endpoints{
  font-size:12px; color:var(--txt-3);
  flex:1 1 auto; min-width:0;
}
.launcher-version{
  font-family:var(--mono);
  font-size:12px;
  color:var(--txt-3);
  letter-spacing:0.04em;
  user-select:none;
  flex:0 0 auto;
  /* Match the summary's vertical position: the summary's first line
     sits at the section's padding-top, and so do we. */
  line-height:1;
  padding-top:1px;
}
.launcher-version:empty{ display:none; }
.dev-endpoints summary{
  cursor:pointer;
  list-style:none;
  display:inline-flex; align-items:center; gap:6px;
  color:var(--txt-3);
  font-family:var(--ui);
  letter-spacing:0.04em;
  user-select:none;
}
.dev-endpoints summary::-webkit-details-marker{ display:none; }
.dev-endpoints summary::before{
  content:"›";
  display:inline-block;
  color:var(--txt-3);
  transition:transform .15s ease;
}
.dev-endpoints[open] summary::before{ transform:rotate(90deg); }
.dev-endpoints summary:hover{ color:var(--txt-2); }
.dev-endpoints-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-top:12px;
  font-family:var(--mono);
}
.dev-endpoints-row a{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:99px;
  border:1px solid var(--line);
  color:var(--txt-2);
  font-size:11px;
  transition:border-color .15s ease, color .15s ease;
}
.dev-endpoints-row a:hover{
  border-color:var(--cyan); color:var(--cyan);
}
.dev-endpoints-row a .dot{
  width:5px; height:5px; border-radius:50%;
  background:var(--txt-3);
  transition:background .15s ease;
}
.dev-endpoints-row a:hover .dot{
  background:var(--cyan); box-shadow:0 0 6px var(--cyan-glow);
}

/* ─── Settings modal ───────────────────────────────────────── */
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(8,9,15,0.86);
  display:none;
  align-items:center; justify-content:center;
  z-index:1000;
}
.modal-backdrop.open{ display:flex; }
.modal{
  width:min(720px, 90vw);
  height:min(620px, 80vh);
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.modal-head h3{
  font-family:var(--display); font-weight:700;
  font-size:15px; letter-spacing:-0.01em;
  color:var(--txt);
}
.modal-close{
  width:30px; height:30px; border-radius:8px;
  background:var(--bg-3); color:var(--txt-2);
  border:1px solid var(--line);
  cursor:pointer; font-size:16px; line-height:1;
  display:grid; place-items:center;
  transition:
    color .15s ease,
    border-color .15s ease;
}
.modal-close:hover{ color:var(--txt); border-color:var(--line-2); }
.modal-body{
  flex:1; min-height:0;
}
.modal-body iframe{
  width:100%; height:100%;
  border:0; display:block;
  background:var(--bg-0);
}

/* Confirm dialog: a smaller variant of the settings modal. Shorter,
   wider on small screens, with a body text + two buttons row. */
.modal.modal-confirm{
  width:min(420px, 92vw);
  height:auto;
}
.modal-confirm .modal-body{
  padding:18px 22px;
  color:var(--txt-2);
  font-size:14px;
  line-height:1.5;
}
.modal-confirm .modal-body p{ margin:0; }
.modal-actions{
  display:flex; justify-content:flex-end; gap:8px;
  padding:12px 18px 16px;
  border-top:1px solid var(--line);
}
/* Destructive primary action: red instead of cyan. */
.btn.primary.danger{
  background:var(--red, #ef4444);
  border-color:var(--red, #ef4444);
  color:#fff;
}
.btn.primary.danger:hover{
  background:#dc2626;
  border-color:#dc2626;
  color:#fff;
}
/* Trash icon hover: tint red so the destructive intent is obvious. */
.btn.icon.danger:hover:not(:disabled){
  border-color:var(--red, #ef4444);
  color:var(--red, #ef4444);
}

/* ─── Drag-drop install toasts ──────────────────────────────── */
/* The full-window drop overlay is drawn by the launcher (which sees
   the visual hint signal via postMessage). Toasts live in the
   dashboard so they sit visually inside the page content rather
   than over the launcher chrome. */
.install-toasts{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:200;
  display:flex; flex-direction:column; gap:8px;
  pointer-events:none;
}
.install-toast{
  min-width:240px; max-width:360px;
  padding:10px 14px;
  border-radius:8px;
  background:rgba(20,22,27,0.96);
  border-left:3px solid var(--green, #22c55e);
  color:var(--txt);
  font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  animation:install-toast-in 150ms ease-out;
}
.install-toast.failed{ border-left-color:var(--red, #ef4444); }
.install-toast .toast-title{ font-weight:600; margin-bottom:2px; }
.install-toast .toast-detail{
  color:var(--txt-3, #a6abbf);
  font-size:12px;
  word-break:break-word;
}
@keyframes install-toast-in{
  from{ opacity:0; transform:translateX(8px); }
  to  { opacity:1; transform:none; }
}
</style>
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="logo">RL</div>
      <div>
        <h1>RL Toolkit</h1>
        <div class="tag">Stats API · Plugin Host</div>
      </div>
    </div>
  </header>

  <section>
    <div class="section-head">
      <h2>Browser sources</h2>
      <span class="count">OBS &amp; Streamlabs</span>
    </div>
    <div class="sources" id="sources"></div>
  </section>

  <section>
    <div class="section-head">
      <div class="section-head-left">
        <h2>Plugins</h2>
        <span class="count" id="stat-count">0</span>
      </div>
      <div class="section-head-right">
        <span id="catalog-error" class="catalog-error" hidden>Couldn’t check for updates · retry</span>
        <button class="btn update-all" type="button" id="update-all-btn" hidden>Update all</button>
        <button class="btn" type="button" id="install-plugin-btn">Install plugin…</button>
        <input type="file" id="install-plugin-input" accept=".rltp" hidden />
      </div>
    </div>
    <div class="plugins" id="pl"></div>
  </section>

  <div id="install-toasts" class="install-toasts" aria-live="polite"></div>

  <div class="dev-footer">
    <details class="dev-endpoints">
      <summary>Developer endpoints</summary>
      <div class="dev-endpoints-row">
        <a href="/api/plugins" target="_blank"><span class="dot"></span>/api/plugins</a>
        <a href="/api/status" target="_blank"><span class="dot"></span>/api/status</a>
        <a href="/api/match-state" target="_blank"><span class="dot"></span>/api/match-state</a>
        <a href="/api/metrics" target="_blank"><span class="dot"></span>/api/metrics</a>
        <a href="/api/events" target="_blank"><span class="dot"></span>/api/events</a>
      </div>
    </details>
    <span id="launcher-version" class="launcher-version" aria-label="Launcher version"></span>
  </div>

</div>

<!-- Generic confirm dialog. Re-used by destructive actions (currently
     just plugin uninstall). The body text is set per-call via JS. -->
<div class="modal-backdrop" id="confirm-modal" role="alertdialog" aria-modal="true" aria-hidden="true">
  <div class="modal modal-confirm" role="document">
    <div class="modal-head">
      <h3 id="confirm-modal-title">Confirm</h3>
    </div>
    <div class="modal-body">
      <p id="confirm-modal-message"></p>
    </div>
    <div class="modal-actions">
      <button class="btn" type="button" id="confirm-modal-cancel">Cancel</button>
      <button class="btn primary danger" type="button" id="confirm-modal-ok">OK</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <h3 id="settings-modal-title">Settings</h3>
      <button class="modal-close" type="button" data-role="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <iframe id="settings-modal-frame" title="Plugin settings"></iframe>
    </div>
  </div>
</div>

<script>
'use strict';

// Stamp body.in-launcher when embedded so CSS can disable text
// selection (desktop-app feel). Standalone browser tabs keep
// native text selection.
if (window.parent !== window) {
  document.documentElement.classList.add('in-launcher');
  // Suppress WebKit's built-in context menu inside the launcher only.
  // Standalone browser tabs keep right-click → reload / inspect.
  window.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ─── Connection pill — short polling, no SSE ───────────────

// ─── Plugin list ───────────────────────────────────────────
// Fetch plugins + overrides together so the per-card enabled toggle
// renders with the correct initial state. Subscribes to _OverridesChanged
// (synthetic, bypasses the SSE filter) so toggling from another tab —
// or from /overlay?edit=1 — re-renders the list in place.
//
// Plugin discovery is dynamic on the backend (the manager re-reads the
// dir on every /api/plugins call), but this dashboard is iframe'd into
// the launcher and would otherwise only fetch on page load. We refetch
// on window focus + visibilitychange so manually adding or removing a
// plugin folder is reflected the next time the user looks at the
// launcher — no full reload needed. The fingerprint check below
// suppresses no-op renders so cards don't flicker on every focus.
let plugins = [];
let overrides = {};
let pluginsFp = '';
let pluginUpdates = []; // [{name, installed_version, latest_version, size_bytes}]
let catalogError = null;

async function refreshPluginUpdates({ trigger } = {}) {
  try {
    const isWriteTrigger = trigger === 'startup' || trigger === 'manual';
    const url = isWriteTrigger ? '/api/plugins/refresh-catalog' : '/api/plugins/updates';
    const opts = isWriteTrigger ? { method: 'POST' } : undefined;
    const r = await fetch(url, opts);
    const body = await r.json().catch(() => ({}));
    pluginUpdates = Array.isArray(body.updates) ? body.updates : [];
    catalogError = body.last_error || null;
  } catch (err) {
    pluginUpdates = [];
    catalogError = String(err && err.message || err);
  }
  renderUpdateHeader();
  renderPlugins();
}

function renderUpdateHeader() {
  const btn = document.getElementById('update-all-btn');
  const err = document.getElementById('catalog-error');
  if (!btn || !err) return;
  if (pluginUpdates.length > 0) {
    btn.hidden = false;
    btn.textContent = 'Update all (' + pluginUpdates.length + ')';
  } else {
    btn.hidden = true;
  }
  // Show the retry hint only when there's a catalog error AND we have
  // no pending updates to display. When updates exist, the row is
  // already visually busy.
  err.hidden = !(catalogError && pluginUpdates.length === 0);
}

function updateForName(name) {
  return pluginUpdates.find(u => u.name === name) || null;
}

function pluginsFingerprint(list) {
  if (!Array.isArray(list)) return '';
  return list
    .map(p => (p && p.name) + '@' + (p && p.version || ''))
    .sort()
    .join('|');
}

async function refreshPluginList() {
  try {
    const [ps, ov] = await Promise.all([
      fetch('/api/plugins').then(r => r.json()).catch(() => []),
      fetch('/api/overlay/overrides').then(r => r.json()).catch(() => ({})),
    ]);
    const nextPlugins = ps || [];
    const nextFp = pluginsFingerprint(nextPlugins);
    const nextOvJSON = JSON.stringify(ov || {});
    const prevOvJSON = JSON.stringify(overrides || {});
    overrides = ov || {};
    const pluginsChanged = nextFp !== pluginsFp;
    if (pluginsChanged) {
      plugins = nextPlugins;
      pluginsFp = nextFp;
    }
    // Skip the re-render when nothing visible changed. Rewriting the
    // grid's innerHTML on every focus event used to race clicks: a
    // gear/uninstall click that landed during the rewrite hit a
    // detached element and the action silently dropped (manifesting
    // as "first click does nothing"). Event delegation handles the
    // mid-render race too, but skipping the no-op render saves CPU
    // and keeps DOM state stable for things like text selection.
    if (pluginsChanged || nextOvJSON !== prevOvJSON) {
      renderPlugins();
    }
  } catch (_) { /* best-effort */ }
}

const initialPluginListReady = Promise.all([
  refreshPluginList(),
  refreshPluginUpdates({ trigger: 'startup' }),
]);
initialPluginListReady.then(() => {
  const es = new EventSource('/events?events=__none__');
  es.onmessage = (e) => {
    let env;
    try { env = JSON.parse(e.data); } catch (_) { return; }
    if (!env) return;
    if (env.Event === '_OverridesChanged') {
      overrides = env.Data || {};
      renderPlugins();
      return;
    }
    if (env.Event === '_PluginUpdated') {
      // Re-fetch the plugin list so the new version renders on the
      // card, and drop the now-installed entry from the updates state.
      refreshPluginList();
      const data = env.Data || {};
      if (data.name) {
        pluginUpdates = pluginUpdates.filter(u => u.name !== data.name);
        renderUpdateHeader();
      }
    }
  };
});

// Reveal the shell once both the fonts have loaded and the plugin
// list has rendered for the first time. Stops the launcher from
// painting in fallback fonts and an empty plugin grid before
// snapping into final state. The 1500ms watchdog covers two
// failure modes: document.fonts.ready never resolving (rare but
// recoverable), and a stalled /api/plugins fetch (the catch in
// refreshPluginList already swallows errors so the promise resolves
// either way, but the watchdog belts-and-braces it regardless). Once
// .ready is set we never unset it; subsequent re-renders shouldn't
// re-hide the shell.
(function gateInitialPaint() {
  let revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    document.documentElement.classList.add('ready');
  }
  Promise.all([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    initialPluginListReady,
  ]).then(reveal, reveal);
  setTimeout(reveal, 1500);
})();

// Re-pull when the launcher window regains focus or the iframe becomes
// visible — covers the "drop a folder into plugins/, then click back
// to the launcher" workflow without polling on a timer.
window.addEventListener('focus', refreshPluginList);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshPluginList();
});

// ─── Browser-source cards ──────────────────────────────────
// Streamer-facing URLs the user pastes into OBS / Streamlabs as a
// browser source. Resolved against location.origin so a streamer
// running the toolkit on a non-default port (or on a different host
// for remote setups) gets the right URL to copy. Click handlers use
// the existing target="_blank" → postMessage bridge above for the
// "Open" button, and navigator.clipboard for "Copy".
const sources = [
  {
    title: 'Overlay',
    hint: 'Add as a Browser Source in OBS',
    path: '/overlay',
  },
  {
    title: 'Overlay editor',
    hint: 'Drag widgets to reposition and resize',
    path: '/overlay?edit=1',
  },
];

function renderSources() {
  const root = document.getElementById('sources');
  if (!root) return;
  root.innerHTML = sources
    .map((s, i) => {
      const url = new URL(s.path, location.origin).toString();
      return (
        '<div class="source-card">' +
        '<div class="source-head">' +
        '<span class="source-title">' + esc(s.title) + '</span>' +
        '<span class="source-hint">' + esc(s.hint) + '</span>' +
        '</div>' +
        '<div class="source-url">' +
        '<span class="source-url-text" data-source-idx="' + i + '">' + esc(url) + '</span>' +
        '</div>' +
        '<div class="source-actions">' +
        '<button class="source-btn" data-source-action="copy" data-source-idx="' + i + '">Copy</button>' +
        '<a class="source-btn" href="' + esc(s.path) + '" target="_blank">Open</a>' +
        '</div>' +
        '</div>'
      );
    })
    .join('');
}

document.getElementById('sources').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-source-action="copy"]');
  if (!btn) return;
  const idx = Number(btn.dataset.sourceIdx);
  const url = new URL(sources[idx].path, location.origin).toString();
  // navigator.clipboard requires a secure context. Inside the launcher's
  // tauri webview this works against http://localhost since localhost
  // counts as secure; in a regular browser tab on http it would fail.
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1400);
  } catch (_) {
    // Fall back to selecting the URL text so the user can ctrl+c.
    const el = document.querySelector('[data-source-idx="' + idx + '"].source-url-text');
    if (el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
});

renderSources();

function isEnabled(name) {
  const ov = overrides[name];
  return ov && ov.enabled === true;
}

function renderPlugins() {
  const c = document.getElementById('pl');
  document.getElementById('stat-count').textContent = plugins.length;

  if (plugins.length === 0) {
    c.innerHTML = '<div class="empty">'
      + '<div class="em-icon">◇</div>'
      + '<h3>No plugins yet</h3>'
      + '<p>Drop a folder with <code>manifest.json</code> + <code>overlay.html</code> into your <code>plugins/</code> directory and refresh.</p>'
      + '</div>';
    return;
  }

  c.innerHTML = plugins.map(p => {
    // Per-view URLs. Each view is a separate file declared in the
    // manifest. dashboard + settings are optional; overlay is always
    // present (the manifest validator enforces it).
    const dashboardURL = p.dashboard?.file
      ? '/plugins/' + p.name + '/' + p.dashboard.file
      : null;
    const initials = (p.title || p.name || '?').replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || '◇';
    const desc = p.description
      ? esc(p.description)
      : '<span style="color:var(--txt-3);font-style:italic">No description provided.</span>';
    const enabled = isEnabled(p.name);

    // The Open button only renders when the plugin ships a dashboard
    // view. Falling back to opening the overlay (which used to be the
    // behavior) led to "Open" launching a blank tab for plugins like
    // ballchasing-upload and crossbar whose overlay is a stub. Better
    // to omit the button than ship one that does nothing useful.
    const openURL = dashboardURL;
    const hasSettings = !!p.settings?.file;

    return '<article class="card' + (enabled ? '' : ' disabled') + '" data-plugin="' + esc(p.name) + '">'
      + '<div class="card-head">'
        + '<div class="card-icon">' + esc(initials) + '</div>'
        + '<div class="card-meta">'
          + '<div class="card-title">' + esc(p.title || p.name) + '</div>'
          + '<div class="card-sub">'
            + (p.version ? '<span class="v">v' + esc(p.version) + '</span>' : '')
            + (p.author ? '<span class="author">@' + esc(p.author) + '</span>' : '')
            + (updateForName(p.name)
                ? '<button class="update-pill" type="button" data-role="update-one" data-name="' + esc(p.name) + '" title="Click to update">↑ Update to ' + esc(updateForName(p.name).latest_version) + '</button>'
                : '')
          + '</div>'
        + '</div>'
        + '<label class="toggle" title="' + (enabled ? 'Disable' : 'Enable') + ' overlay">'
          + '<input type="checkbox" data-role="enabled"' + (enabled ? ' checked' : '') + '>'
          + '<span class="knob"></span>'
        + '</label>'
      + '</div>'
      + '<p class="card-desc">' + desc + '</p>'
      + '<div class="card-actions">'
        + (openURL ? '<a class="btn primary" href="' + openURL + '" target="_blank">Open <span class="arrow">→</span></a>' : '')
        + '<button class="btn icon" data-role="settings" type="button"'
          + ' aria-label="Settings"'
          + ' title="' + (hasSettings ? 'Settings' : 'No settings for this plugin') + '"'
          + (hasSettings ? '' : ' disabled')
          + '>'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<circle cx="12" cy="12" r="3"/>'
            + '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
          + '</svg>'
        + '</button>'
        + '<button class="btn icon danger" data-role="uninstall" type="button"'
          + ' aria-label="Uninstall"'
          + ' title="Uninstall">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<polyline points="3 6 5 6 21 6"/>'
            + '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'
            + '<path d="M10 11v6"/>'
            + '<path d="M14 11v6"/>'
            + '<path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'
          + '</svg>'
        + '</button>'
      + '</div>'
    + '</article>';
  }).join('');

}

// Delegated handlers on the plugin grid — the grid is rebuilt
// (innerHTML rewrite) on every focus/visibilitychange refresh, which
// would drop per-button listeners attached during render. A click that
// arrived between innerHTML reset and listener re-attachment used to
// silently no-op, requiring a second click. Delegating to the
// container (which is never replaced) makes the buttons work even mid
// re-render.
(function wirePluginGridDelegation() {
  const c = document.getElementById('pl');
  if (!c) return;
  c.addEventListener('click', (ev) => {
    const card = ev.target.closest('.card');
    if (!card) return;
    const name = card.getAttribute('data-plugin');
    if (!name) return;
    const settingsBtn = ev.target.closest('button[data-role="settings"]');
    if (settingsBtn && !settingsBtn.disabled) {
      openSettingsModal(name);
      return;
    }
    const uninstallBtn = ev.target.closest('button[data-role="uninstall"]');
    if (uninstallBtn && !uninstallBtn.disabled) {
      uninstallPlugin(name);
    }
    const updPill = ev.target.closest('button[data-role="update-one"]');
    if (updPill && !updPill.disabled) {
      ev.preventDefault();
      const name = updPill.getAttribute('data-name');
      runUpdateOne(name, updPill).catch(() => {});
      return;
    }
  });
  c.addEventListener('change', (ev) => {
    const cb = ev.target.closest('input[data-role="enabled"]');
    if (!cb) return;
    const card = cb.closest('.card');
    const name = card && card.getAttribute('data-plugin');
    if (!name) return;
    setEnabled(name, cb.checked, cb);
  });
})();

async function runUpdateOne(name, pillEl) {
  if (!name) return;
  if (pillEl) { pillEl.disabled = true; pillEl.textContent = 'Updating…'; }
  try {
    const r = await fetch('/api/plugins/install-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || ('HTTP ' + r.status));
    }
  } catch (err) {
    spawnInstallToast({
      kind: 'failed',
      title: 'Update failed: ' + name,
      detail: err && err.message || String(err),
    });
    if (pillEl) {
      pillEl.disabled = false;
      pillEl.textContent = '↑ Retry';
    }
    throw err;
  }
  // Success: drop optimistically. SSE _PluginUpdated will re-fetch
  // the plugin list so the card's version label updates.
  pluginUpdates = pluginUpdates.filter(u => u.name !== name);
  renderUpdateHeader();
}

async function runUpdateAll() {
  const btn = document.getElementById('update-all-btn');
  if (btn) btn.disabled = true;
  const names = pluginUpdates.map(u => u.name);
  let failed = 0;
  for (const name of names) {
    const pill = document.querySelector(
      '[data-role="update-one"][data-name="' + cssIdentEscape(name) + '"]'
    );
    try {
      await runUpdateOne(name, pill);
    } catch (_) { failed++; }
  }
  if (btn) btn.disabled = false;
  if (failed > 0) {
    spawnInstallToast({
      kind: 'failed',
      title: failed + ' update' + (failed === 1 ? '' : 's') + ' failed',
    });
  }
}

// Minimal CSS attribute-selector escape. Plugin names are validated
// server-side to safe characters, but defend against the edge cases
// (digits, hyphens) regardless.
function cssIdentEscape(s) {
  return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c.charCodeAt(0).toString(16) + ' ');
}

async function setEnabled(name, enabled, cb) {
  try {
    const r = await fetch('/api/overlay/overrides/' + encodeURIComponent(name), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // The SSE _OverridesChanged event will re-render. No optimistic
    // local mutation needed — keeps the dashboard's view of overrides
    // exactly in sync with the server's.
  } catch (err) {
    cb.checked = !enabled; // roll back the visible toggle
    console.error('[dashboard] toggle failed', err);
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ─── Settings modal ────────────────────────────────────────
const settingsModal = document.getElementById('settings-modal');
const settingsModalTitle = document.getElementById('settings-modal-title');
const settingsModalFrame = document.getElementById('settings-modal-frame');

function openSettingsModal(pluginName) {
  const p = plugins.find(x => x.name === pluginName);
  if (!p?.settings?.file) return;
  settingsModalTitle.textContent = (p.title || p.name) + ' — Settings';
  settingsModalFrame.src = '/plugins/' + encodeURIComponent(p.name) + '/' + p.settings.file;
  settingsModal.classList.add('open');
  settingsModal.setAttribute('aria-hidden', 'false');
}

function closeSettingsModal() {
  settingsModal.classList.remove('open');
  settingsModal.setAttribute('aria-hidden', 'true');
  // Clear src so the previous plugin's view is unloaded; otherwise the
  // next open might race against an already-running iframe.
  settingsModalFrame.src = 'about:blank';
}

settingsModal.querySelector('[data-role="modal-close"]').addEventListener('click', closeSettingsModal);

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) closeSettingsModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsModal.classList.contains('open')) closeSettingsModal();
});

// ─── Confirm dialog ────────────────────────────────────────
//
// Promise-based confirm using the #confirm-modal markup. Returns true
// when the user clicks the primary action, false on cancel/Escape/
// backdrop. Single-instance: a second call while the first is open
// resolves the first as `false` before opening anew.
const confirmModal = document.getElementById('confirm-modal');
const confirmTitle = document.getElementById('confirm-modal-title');
const confirmMessage = document.getElementById('confirm-modal-message');
const confirmOk = document.getElementById('confirm-modal-ok');
const confirmCancel = document.getElementById('confirm-modal-cancel');
let confirmResolver = null;
function closeConfirm(result) {
  if (!confirmResolver) return;
  const r = confirmResolver;
  confirmResolver = null;
  confirmModal.classList.remove('open');
  confirmModal.setAttribute('aria-hidden', 'true');
  r(result);
}
function showConfirm({ title, message, confirmLabel }) {
  if (confirmResolver) closeConfirm(false);
  confirmTitle.textContent = title || 'Confirm';
  confirmMessage.textContent = message || '';
  confirmOk.textContent = confirmLabel || 'OK';
  confirmModal.classList.add('open');
  confirmModal.setAttribute('aria-hidden', 'false');
  confirmOk.focus();
  return new Promise((resolve) => { confirmResolver = resolve; });
}
confirmOk.addEventListener('click', () => closeConfirm(true));
confirmCancel.addEventListener('click', () => closeConfirm(false));
confirmModal.addEventListener('click', (e) => {
  if (e.target === confirmModal) closeConfirm(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && confirmModal.classList.contains('open')) closeConfirm(false);
});

// ─── Uninstall a plugin ────────────────────────────────────
async function uninstallPlugin(name) {
  const ok = await showConfirm({
    title: 'Uninstall ' + name + '?',
    message: 'This removes the plugin folder from disk. User data stored under /api/data/'
      + name + ' is preserved. The action cannot be undone — to restore the plugin you\'ll need '
      + 'to install it again.',
    confirmLabel: 'Uninstall',
  });
  if (!ok) return;
  try {
    const r = await fetch('/api/plugins/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!r.ok && r.status !== 204) {
      const text = (await r.text()).trim();
      spawnInstallToast({
        kind: 'failed',
        title: 'Uninstall failed: ' + name,
        detail: text || ('server returned ' + r.status),
      });
      return;
    }
    spawnInstallToast({ kind: 'ok', title: 'Uninstalled ' + name });
    if (typeof refreshPluginList === 'function') refreshPluginList();
  } catch (e) {
    spawnInstallToast({
      kind: 'failed',
      title: 'Uninstall failed: ' + name,
      detail: String(e && e.message ? e.message : e),
    });
  }
}

// Module-level toast helper used by both install and uninstall flows.
// Defined here so uninstallPlugin (above) and the install-picker IIFE
// (below) can share it. Idempotent if the toast container is missing.
function spawnInstallToast({ kind, title, detail }) {
  const toasts = document.getElementById('install-toasts');
  if (!toasts) return;
  const el = document.createElement('div');
  el.className = 'install-toast' + (kind === 'failed' ? ' failed' : '');
  const t = document.createElement('div');
  t.className = 'toast-title';
  t.textContent = title;
  el.appendChild(t);
  if (detail) {
    const d = document.createElement('div');
    d.className = 'toast-detail';
    d.textContent = detail;
    el.appendChild(d);
  }
  toasts.appendChild(el);
  const ttl = kind === 'failed' ? 8000 : 4000;
  setTimeout(() => {
    el.style.transition = 'opacity 200ms ease-out';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 220);
  }, ttl);
}

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === 'rlt:settings:close') closeSettingsModal();
});

// Cross-origin: the Tauri launcher (different origin) posts the
// launcher version after the iframe loads so the footer version label
// stays in sync with the running launcher. Accept by message-type
// only; the payload is a short string we render verbatim, no DOM
// injection beyond textContent.
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type !== 'rl-launcher:set-version') return;
  const v = typeof e.data.version === 'string' ? e.data.version.trim() : '';
  const el = document.getElementById('launcher-version');
  if (!el) return;
  el.textContent = v ? 'v' + v.replace(/^v/i, '') : '';
});

// When the dashboard is embedded inside the RL Toolkit launcher, links
// with target="_blank" can't open a new tab — there's no tab system in
// the launcher's webview. Forward those clicks to the launcher via
// postMessage so it can open the URL in the user's real browser.
const inLauncher = window.parent !== window;
if (inLauncher) {
  document.addEventListener('click', (ev) => {
    const a = ev.target.closest && ev.target.closest('a[target="_blank"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href) return;
    // Resolve relative URLs against the dashboard's origin so the
    // launcher gets an absolute URL to hand to the OS opener.
    let absolute;
    try { absolute = new URL(href, location.href).toString(); }
    catch (_) { return; }
    ev.preventDefault();
    window.parent.postMessage({ type: 'rl-launcher:open-external', url: absolute }, '*');
  });
}

(function wireUpdateButtons() {
  const updateAllBtn = document.getElementById('update-all-btn');
  if (updateAllBtn) {
    updateAllBtn.addEventListener('click', () => runUpdateAll());
  }
  const catalogErrEl = document.getElementById('catalog-error');
  if (catalogErrEl) {
    catalogErrEl.addEventListener('click', () => refreshPluginUpdates({ trigger: 'manual' }));
  }
})();

// ─── Install plugin from file ───────────────────────────────
//
// Click the "Install plugin…" button → native file picker → upload
// the chosen .rltp to /api/sideload → toast the result, refresh the
// plugin list. Same backend endpoint the `rl-toolkit install` CLI
// hits, so the install is identical.
(function initInstallPicker() {
  const btn = document.getElementById('install-plugin-btn');
  const input = document.getElementById('install-plugin-input');
  if (!btn || !input) return;

  btn.addEventListener('click', () => input.click());

  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    // Reset value so the same file can be picked again later.
    input.value = '';
    if (!file) return;
    if (!/\.rltp$/i.test(file.name)) {
      spawnInstallToast({
        kind: 'failed',
        title: 'Not a plugin file',
        detail: file.name + ' — expected a .rltp archive',
      });
      return;
    }
    btn.disabled = true;
    try {
      await uploadOne(file);
      if (typeof refreshPluginList === 'function') refreshPluginList();
    } finally {
      btn.disabled = false;
    }
  });

  async function uploadOne(file) {
    const fd = new FormData();
    fd.append('file', file, file.name);
    try {
      const r = await fetch('/api/sideload', { method: 'POST', body: fd });
      if (!r.ok) {
        const text = (await r.text()).trim();
        spawnInstallToast({
          kind: 'failed',
          title: 'Install failed: ' + file.name,
          detail: text || ('server returned ' + r.status),
        });
        return;
      }
      let name = '';
      try { name = (await r.json()).name || ''; } catch (_) {}
      spawnInstallToast({
        kind: 'ok',
        title: 'Installed ' + (name || file.name.replace(/\.rltp$/i, '')),
        detail: name && file.name !== name + '.rltp' ? file.name : '',
      });
    } catch (e) {
      spawnInstallToast({
        kind: 'failed',
        title: 'Install failed: ' + file.name,
        detail: String(e && e.message ? e.message : e),
      });
    }
  }
})();

</script>
