<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RL Toolkit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Surfaces */
  --bg-0:#08090f; --bg-1:#0f1117; --bg-2:#161922; --bg-3:#1f232f;
  --line:#252938; --line-2:#363b4d;

  /* Text */
  --txt:#e9ecf2; --txt-2:#a6abbf; --txt-3:#6c7286;

  /* Accents */
  --cyan:#22d3ee;   --cyan-glow:rgba(34,211,238,0.35);
  --violet:#a78bfa; --violet-glow:rgba(167,139,250,0.35);
  --green:#22c55e;
  --gold:#fbbf24;
  --rose:#f472b6;

  /* Type */
  --display:'Inter Tight', system-ui, sans-serif;
  --ui:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--ui); font-size:14px; color:var(--txt);
  background:
    radial-gradient(1400px 700px at 85% -10%, rgba(167,139,250,0.10), transparent 60%),
    radial-gradient(1100px 550px at -10% 110%, rgba(34,211,238,0.07), transparent 60%),
    var(--bg-0);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  letter-spacing:-0.005em;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ─── Layout ───────────────────────────────────────────────── */
.shell{
  max-width:1280px; margin:0 auto;
  padding:24px 32px 40px;
}
@media (max-width:720px){ .shell{ padding:20px 18px 32px; } }

/* ─── Topbar ───────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 4px 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand .logo{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  box-shadow: 0 8px 24px -8px var(--violet-glow);
}
.brand h1{
  font-family:var(--display); font-weight:800;
  font-size:22px; letter-spacing:-0.025em; line-height:1;
  color:#fff;
}
.brand .tag{
  font-size:12px; color:var(--txt-3);
  margin-top:3px; letter-spacing:0;
}


/* ─── Section heading ──────────────────────────────────────── */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 4px 4px 16px;
}
.section-head h2{
  font-family:var(--display); font-weight:600;
  font-size:18px; letter-spacing:-0.015em; line-height:1;
  color:var(--txt);
}
.section-head .count{
  font-family:var(--mono); font-size:12px;
  color:var(--txt-3);
  font-feature-settings:'tnum';
}

/* ─── Plugin grid ──────────────────────────────────────────── */
.plugins{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap:14px;
  margin-bottom:48px;
}

.card{
  position:relative;
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2) 110%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 22px 18px;
  display:flex; flex-direction:column; gap:14px;
  min-height:200px;
  overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(360px 200px at 100% 0%, rgba(167,139,250,0.08), transparent 60%);
  opacity:0; transition:opacity .25s ease;
  pointer-events:none;
}
.card::after{
  content:''; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
  opacity:0; transition:opacity .25s ease;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--line-2);
  box-shadow:0 24px 48px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(167,139,250,.12);
}
.card:hover::before, .card:hover::after{ opacity:1; }

.card-head{ display:flex; align-items:center; gap:12px; }
.card-icon{
  width:44px; height:44px; border-radius:11px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  flex-shrink:0;
}
.card-meta{ flex:1; min-width:0; }
.card-title{
  font-family:var(--display); font-weight:700;
  font-size:18px; letter-spacing:-0.015em; line-height:1.2;
  color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-sub{
  display:flex; align-items:center; gap:8px;
  margin-top:4px;
  font-size:12px; color:var(--txt-3);
}
.card-sub .v{
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:0.06em;
  background:var(--bg-3); border:1px solid var(--line);
  padding:2px 8px; border-radius:99px;
  color:var(--txt-2);
}
.card-sub .author{
  font-family:var(--mono); color:var(--txt-3);
}

.card-desc{
  font-size:13px; line-height:1.55;
  color:var(--txt-2);
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-actions{ display:flex; gap:6px; }
.btn{
  flex:1;
  font-family:var(--ui); font-size:12px; font-weight:600;
  letter-spacing:0;
  padding:10px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg-3); color:var(--txt);
  cursor:pointer;
  /* Explicit list — hover variants flip border-color, color, filter,
     and box-shadow. `transition: all` would force a watch on every
     property even though only these change. */
  transition:
    border-color .15s ease,
    color .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.btn.primary{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  color:var(--bg-0); border-color:transparent; font-weight:700;
}
.btn.primary:hover{
  filter:brightness(1.08);
  box-shadow:0 8px 24px -8px var(--cyan-glow), 0 8px 24px -8px var(--violet-glow);
  color:var(--bg-0);
}
.btn .arrow{ font-size:11px; transition:transform .2s ease; }
.btn.primary:hover .arrow{ transform:translateX(2px); }

/* ─── Per-plugin toggle ────────────────────────────────────── */
/* Toggle in the card head, opposite the icon. Visually obvious so
   the user can see which plugins are active at a glance. The card
   itself dims to ~60% when disabled so the inactive set reads
   instantly across a long list. */
.card.disabled{ opacity:0.6; }
.card.disabled .card-icon{ filter:grayscale(0.7); }
.card-head{ position:relative; }
.toggle{
  position:absolute; top:0; right:0;
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; color:var(--txt-3);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600;
  cursor:pointer; user-select:none;
}
.toggle input{ position:absolute; opacity:0; pointer-events:none; }
.toggle .knob{
  width:32px; height:18px; background:var(--bg-3);
  border:1px solid var(--line); border-radius:99px;
  position:relative;
  transition:
    background .15s ease,
    border-color .15s ease;
}
.toggle .knob::after{
  content:''; position:absolute; top:1px; left:1px;
  width:14px; height:14px; border-radius:50%;
  background:var(--txt-3);
  transition:
    left .15s ease,
    background .15s ease;
}
.toggle input:checked + .knob{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  border-color:transparent;
}
.toggle input:checked + .knob::after{
  left:15px; background:var(--bg-0);
}

/* ─── Empty state ──────────────────────────────────────────── */
.empty{
  grid-column:1 / -1;
  background:var(--bg-1); border:1px dashed var(--line-2);
  border-radius:14px;
  padding:48px 32px; text-align:center;
}
.empty .em-icon{
  width:48px; height:48px; margin:0 auto 14px;
  border-radius:12px;
  background:var(--bg-3); border:1px solid var(--line);
  display:grid; place-items:center;
  font-size:22px; color:var(--txt-3);
}
.empty h3{
  font-family:var(--display); font-weight:700; font-size:18px;
  letter-spacing:-0.015em; color:#fff; margin-bottom:6px;
}
.empty p{ color:var(--txt-3); font-size:13px; max-width:380px; margin:0 auto; line-height:1.55; }
.empty code{
  font-family:var(--mono); font-size:12px;
  color:var(--cyan);
  background:var(--bg-3); padding:1px 6px; border-radius:4px;
}

/* ─── Footer ribbon ────────────────────────────────────────── */
.ribbon{
  border-top:1px solid var(--line);
  padding-top:16px; margin-top:8px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:11px; color:var(--txt-3);
  font-family:var(--mono);
}
.ribbon .label{
  text-transform:uppercase; letter-spacing:0.16em;
  color:var(--txt-3);
  font-family:var(--ui); font-weight:600;
  margin-right:4px;
}

/* ─── Identity strip ──────────────────────────────────────── */
.identity-strip{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:28px; font-size:13px; color:var(--txt-2);
}
.identity-strip.editing{
  padding:4px 0;
}
.id-row{
  display:flex; align-items:center; gap:8px;
}
.id-label{
  text-transform:uppercase; font-size:10px;
  letter-spacing:0.16em; font-weight:700; color:var(--txt-3);
}
.id-value{
  font-family:var(--display); font-size:14px;
  font-weight:600; color:#fff; letter-spacing:0.01em;
}
.id-value.unset{ color:var(--txt-3); font-style:italic; font-weight:400; font-size:13px; }
.id-edit-btn{
  background:none; border:none;
  color:var(--txt-3); cursor:pointer; font-size:12px;
  padding:2px 4px;
  transition:color .15s ease;
}
.id-edit-btn:hover{ color:var(--cyan); }
.identity-strip.editing .id-row{ display:none; }
.id-editor{
  display:none; align-items:center; gap:8px;
  flex-wrap:wrap; flex:1;
}
.identity-strip.editing .id-editor{ display:flex; }
.id-search-wrap{ position:relative; flex:1 1 280px; min-width:0; }
.id-editor input{
  width:100%;
  font-family:var(--ui); font-size:13px;
  padding:8px 12px; border-radius:8px;
  border:none; background:var(--bg-3);
  color:var(--txt); outline:none;
}
.id-results{
  display:none; position:absolute; left:0; right:0; top:100%;
  margin-top:4px; max-height:240px; overflow-y:auto;
  background:var(--bg-2); border:1px solid var(--line);
  border-radius:10px; padding:4px;
  z-index:20;
}
.id-results.open{ display:block; }
.id-result{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:6px;
  cursor:pointer; transition:background .1s ease;
}
.id-result:hover, .id-result.active{ background:var(--bg-3); }
.id-result-icon{ width:16px; height:16px; color:var(--txt-3); flex-shrink:0; }
.id-result-icon svg{ width:16px; height:16px; display:block; }
.id-result-name{
  font-weight:600; color:var(--txt); font-size:13px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.id-result-meta{
  margin-left:auto; font-size:11px; color:var(--txt-3);
  font-family:var(--mono); white-space:nowrap;
}
.id-editor .btn{
  flex:0; padding:8px 14px;
}
.id-editor .btn.ghost{
  background:transparent; border-color:var(--line); color:var(--txt-2);
}
.id-editor .btn.ghost:hover{ border-color:var(--line-2); color:var(--txt); }
.ribbon a{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:99px;
  border:1px solid var(--line);
  color:var(--txt-2);
  transition:
    border-color .15s ease,
    color .15s ease;
}
.ribbon a:hover{
  border-color:var(--cyan); color:var(--cyan);
}
.ribbon a .dot{
  width:5px; height:5px; border-radius:50%;
  background:var(--txt-3);
  transition:background .15s ease;
}
.ribbon a:hover .dot{ background:var(--cyan); box-shadow:0 0 6px var(--cyan-glow); }

/* ─── Settings modal ───────────────────────────────────────── */
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(8,9,15,0.78);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center; justify-content:center;
  z-index:1000;
}
.modal-backdrop.open{ display:flex; }
.modal{
  width:min(720px, 90vw);
  height:min(620px, 80vh);
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.modal-head h3{
  font-family:var(--display); font-weight:700;
  font-size:15px; letter-spacing:-0.01em;
  color:var(--txt);
}
.modal-close{
  width:30px; height:30px; border-radius:8px;
  background:var(--bg-3); color:var(--txt-2);
  border:1px solid var(--line);
  cursor:pointer; font-size:16px; line-height:1;
  display:grid; place-items:center;
  transition:
    color .15s ease,
    border-color .15s ease;
}
.modal-close:hover{ color:var(--txt); border-color:var(--line-2); }
.modal-body{
  flex:1; min-height:0;
}
.modal-body iframe{
  width:100%; height:100%;
  border:0; display:block;
  background:var(--bg-0);
}
.surface-panel {
  background: #131726;
  border: 1px solid #232a44;
  border-radius: 8px;
  padding: 14px 16px;
}
.surface-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.surface-row label {
  font: 600 11px Inter, sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a9b0cf;
}
.surface-row input[type='number'] {
  width: 96px;
  padding: 6px 8px;
  background: #0f1320;
  color: #e6e9f5;
  border: 1px solid #232a44;
  border-radius: 6px;
  font: 500 12px JetBrains Mono, monospace;
}
.surface-detail {
  margin-top: 10px;
  font: 500 11px Inter, sans-serif;
  color: #7f88ad;
  letter-spacing: 0.02em;
}
.surface-detail .mismatch {
  color: #f97316;
}
</style>
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="logo">RL</div>
      <div>
        <h1>RL Toolkit</h1>
        <div class="tag">Stats API · Plugin Host</div>
      </div>
    </div>
  </header>

  <div class="identity-strip" id="id-strip">
    <div class="id-row">
      <span class="id-label">you:</span>
      <span class="id-value unset" id="id-value">not set</span>
      <button type="button" class="id-edit-btn" id="id-edit" title="Change identity">✎</button>
    </div>
    <div class="id-editor">
      <div class="id-search-wrap">
        <input type="text" id="id-input" placeholder="Search by name…" autocomplete="off">
        <div class="id-results" id="id-results"></div>
      </div>
      <button type="button" class="btn ghost" id="id-clear">Clear</button>
      <button type="button" class="btn ghost" id="id-cancel">Cancel</button>
    </div>
  </div>

  <section>
    <div class="section-head">
      <h2>Overlay surface</h2>
      <span class="count" id="surface-effective-label">—</span>
    </div>
    <div class="surface-panel" id="surface-panel">
      <div class="surface-row">
        <label for="surface-w">Width</label>
        <input type="number" id="surface-w" min="1" max="16384" />
        <label for="surface-h">Height</label>
        <input type="number" id="surface-h" min="1" max="16384" />
        <button type="button" class="btn" id="surface-save">Save</button>
        <button type="button" class="btn ghost" id="surface-use-detected" disabled>Use detected</button>
        <button type="button" class="btn ghost" id="surface-clear">Clear</button>
      </div>
      <div class="surface-detail" id="surface-detail"></div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Plugins</h2>
      <span class="count" id="stat-count">0</span>
    </div>
    <div class="plugins" id="pl"></div>
  </section>

  <footer class="ribbon">
    <span class="label">Endpoints</span>
    <a href="/overlay" target="_blank"><span class="dot"></span>/overlay</a>
    <a href="/overlay?edit=1" target="_blank"><span class="dot"></span>/overlay?edit=1</a>
    <a href="/events" target="_blank"><span class="dot"></span>/events</a>
    <a href="/api/plugins" target="_blank"><span class="dot"></span>/api/plugins</a>
    <a href="/api/status" target="_blank"><span class="dot"></span>/api/status</a>
    <a href="/api/match-state" target="_blank"><span class="dot"></span>/api/match-state</a>
    <a href="/api/metrics" target="_blank"><span class="dot"></span>/api/metrics</a>
    <a href="/api/events" target="_blank"><span class="dot"></span>/api/events</a>
  </footer>

</div>

<div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <h3 id="settings-modal-title">Settings</h3>
      <button class="modal-close" type="button" data-role="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <iframe id="settings-modal-frame" title="Plugin settings"></iframe>
    </div>
  </div>
</div>

<script>
'use strict';

// ─── Connection pill — short polling, no SSE ───────────────

// ─── Plugin list ───────────────────────────────────────────
// Fetch plugins + overrides together so the per-card enabled toggle
// renders with the correct initial state. Subscribes to _OverridesChanged
// (synthetic, bypasses the SSE filter) so toggling from another tab —
// or from /overlay?edit=1 — re-renders the list in place.
let plugins = [];
let overrides = {};

Promise.all([
  fetch('/api/plugins').then(r => r.json()).catch(() => []),
  fetch('/api/overlay/overrides').then(r => r.json()).catch(() => ({})),
]).then(([ps, ov]) => {
  plugins = ps || [];
  overrides = ov || {};
  renderPlugins();

  const es = new EventSource('/events?events=__none__');
  es.onmessage = (e) => {
    let env;
    try { env = JSON.parse(e.data); } catch (_) { return; }
    if (!env || env.Event !== '_OverridesChanged') return;
    overrides = env.Data || {};
    renderPlugins();
  };
});

function isEnabled(name) {
  const ov = overrides[name];
  return ov && ov.enabled === true;
}

function renderPlugins() {
  const c = document.getElementById('pl');
  document.getElementById('stat-count').textContent = plugins.length;

  if (plugins.length === 0) {
    c.innerHTML = '<div class="empty">'
      + '<div class="em-icon">◇</div>'
      + '<h3>No plugins yet</h3>'
      + '<p>Drop a folder with <code>manifest.json</code> + <code>overlay.html</code> into your <code>plugins/</code> directory and refresh.</p>'
      + '</div>';
    return;
  }

  c.innerHTML = plugins.map(p => {
    // Per-view URLs. Each view is a separate file declared in the
    // manifest. dashboard + settings are optional; overlay is always
    // present (the manifest validator enforces it).
    const dashboardURL = p.dashboard?.file
      ? '/plugins/' + p.name + '/' + p.dashboard.file
      : null;
    const overlayURL = p.overlay?.file
      ? '/plugins/' + p.name + '/' + p.overlay.file
      : null;
    const initials = (p.title || p.name || '?').replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || '◇';
    const desc = p.description
      ? esc(p.description)
      : '<span style="color:var(--txt-3);font-style:italic">No description provided.</span>';
    const enabled = isEnabled(p.name);

    // "Open" button preference: dashboard view if the plugin has one
    // (the rich, full-page UI), else fall back to opening the overlay
    // in a browser tab (useful for debugging without launching Tauri).
    const openURL = dashboardURL || overlayURL;
    const openLabel = dashboardURL ? 'Open Dashboard' : 'Open Overlay';

    return '<article class="card' + (enabled ? '' : ' disabled') + '" data-plugin="' + esc(p.name) + '">'
      + '<div class="card-head">'
        + '<div class="card-icon">' + esc(initials) + '</div>'
        + '<div class="card-meta">'
          + '<div class="card-title">' + esc(p.title || p.name) + '</div>'
          + '<div class="card-sub">'
            + (p.version ? '<span class="v">v' + esc(p.version) + '</span>' : '')
            + (p.author ? '<span class="author">@' + esc(p.author) + '</span>' : '')
          + '</div>'
        + '</div>'
        + '<label class="toggle" title="' + (enabled ? 'Disable' : 'Enable') + ' overlay">'
          + '<input type="checkbox" data-role="enabled"' + (enabled ? ' checked' : '') + '>'
          + '<span class="knob"></span>'
        + '</label>'
      + '</div>'
      + '<p class="card-desc">' + desc + '</p>'
      + '<div class="card-actions">'
        + (openURL ? '<a class="btn primary" href="' + openURL + '" target="_blank">' + openLabel + ' <span class="arrow">→</span></a>' : '')
        + (p.settings?.file ? '<button class="btn" data-role="settings" type="button">Settings</button>' : '')
      + '</div>'
    + '</article>';
  }).join('');

  // Wire toggles
  c.querySelectorAll('.card').forEach(card => {
    const name = card.getAttribute('data-plugin');
    const cb = card.querySelector('input[data-role="enabled"]');
    cb.addEventListener('change', () => setEnabled(name, cb.checked, cb));
    const settingsBtn = card.querySelector('button[data-role="settings"]');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', () => openSettingsModal(name));
    }
  });
}

async function setEnabled(name, enabled, cb) {
  try {
    const r = await fetch('/api/overlay/overrides/' + encodeURIComponent(name), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // The SSE _OverridesChanged event will re-render. No optimistic
    // local mutation needed — keeps the dashboard's view of overrides
    // exactly in sync with the server's.
  } catch (err) {
    cb.checked = !enabled; // roll back the visible toggle
    console.error('[dashboard] toggle failed', err);
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ─── Settings modal ────────────────────────────────────────
const settingsModal = document.getElementById('settings-modal');
const settingsModalTitle = document.getElementById('settings-modal-title');
const settingsModalFrame = document.getElementById('settings-modal-frame');

function openSettingsModal(pluginName) {
  const p = plugins.find(x => x.name === pluginName);
  if (!p?.settings?.file) return;
  settingsModalTitle.textContent = (p.title || p.name) + ' — Settings';
  settingsModalFrame.src = '/plugins/' + encodeURIComponent(p.name) + '/' + p.settings.file;
  settingsModal.classList.add('open');
  settingsModal.setAttribute('aria-hidden', 'false');
}

function closeSettingsModal() {
  settingsModal.classList.remove('open');
  settingsModal.setAttribute('aria-hidden', 'true');
  // Clear src so the previous plugin's view is unloaded; otherwise the
  // next open might race against an already-running iframe.
  settingsModalFrame.src = 'about:blank';
}

settingsModal.querySelector('[data-role="modal-close"]').addEventListener('click', closeSettingsModal);

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) closeSettingsModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsModal.classList.contains('open')) closeSettingsModal();
});

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === 'rlt:settings:close') closeSettingsModal();
});

  function platformKey(id) {
    const p = (id || '').split('|')[0].toLowerCase();
    if (p === 'steam') return 'steam';
    if (p === 'epic') return 'epic';
    if (p.startsWith('ps')) return 'playstation';
    if (p.startsWith('xbox')) return 'xbox';
    if (p === 'switch' || p.includes('nintendo')) return 'switch';
    return null;
  }

  function platformSvg(id) {
    const key = platformKey(id);
    const d = key && PLATFORM_ICONS[key];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24"><path fill="currentColor" d="' + d + '"/></svg>';
  }

  const strip = document.getElementById('id-strip');
  const valEl = document.getElementById('id-value');
  const input = document.getElementById('id-input');
  const results = document.getElementById('id-results');
  const editBtn = document.getElementById('id-edit');
  const clearBtn = document.getElementById('id-clear');
  const cancelBtn = document.getElementById('id-cancel');

  let currentId = '';
  let players = [];
  let activeIdx = -1;

  function display(id, name) {
    currentId = id || '';
    if (currentId) {
      valEl.textContent = name || currentId;
      valEl.classList.remove('unset');
    } else {
      valEl.textContent = 'not set';
      valEl.classList.add('unset');
    }
  }

  function openEditor() {
    input.value = '';
    strip.classList.add('editing');
    input.focus();
    activeIdx = -1;
    renderResults('');
  }

  function closeEditor() {
    strip.classList.remove('editing');
    results.classList.remove('open');
  }

  function renderResults(query) {
    const q = query.toLowerCase();
    const filtered = q
      ? players.filter(p => p.name.toLowerCase().includes(q) ||
          p.aliases.some(a => a.toLowerCase().includes(q)))
      : players;
    const shown = filtered.slice(0, 20);

    if (shown.length === 0) {
      results.innerHTML = '<div style="padding:10px 12px;color:var(--txt-3);font-size:12px">' +
        (players.length === 0 ? 'no encounters yet — play a match first' : 'no matches') + '</div>';
      results.classList.add('open');
      return;
    }

    results.innerHTML = shown.map((p, i) =>
      '<div class="id-result' + (i === activeIdx ? ' active' : '') + '" data-id="' + esc(p.id) + '" data-name="' + esc(p.name) + '">' +
        '<span class="id-result-icon">' + platformSvg(p.id) + '</span>' +
        '<span class="id-result-name">' + esc(p.name) + '</span>' +
        '<span class="id-result-meta">' + p.count + '×</span>' +
      '</div>'
    ).join('');
    results.classList.add('open');
  }

  results.addEventListener('click', (e) => {
    const row = e.target.closest('.id-result');
    if (!row) return;
    save(row.dataset.id, row.dataset.name);
  });

  input.addEventListener('input', () => {
    activeIdx = -1;
    renderResults(input.value);
  });

  input.addEventListener('keydown', (e) => {
    const items = results.querySelectorAll('.id-result');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const sel = items[activeIdx];
      if (sel) save(sel.dataset.id, sel.dataset.name);
    } else if (e.key === 'Escape') {
      closeEditor();
    }
  });

  async function save(id, name) {
    const trimmed = (id || '').trim();
    try {
      const r = await fetch('/api/data/_rlt/identity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ my_id: trimmed }),
      });
      if (r.ok) display(trimmed, name);
    } catch (_) { /* noop */ }
    closeEditor();
  }

  async function loadEncounters() {
    try {
      const r = await fetch('/api/data/_rlt/encounters');
      if (!r.ok) return;
      const map = await r.json();
      players = Object.entries(map || {})
        .filter(([id]) => !id.startsWith('Bot|'))
        .map(([id, e]) => ({
          id,
          name: e.names?.[e.names.length - 1] || id,
          aliases: e.names?.slice(0, -1) || [],
          count: e.count || 1,
          last: e.last_seen,
        }))
        .sort((a, b) => b.count - a.count || new Date(b.last) - new Date(a.last));
    } catch (_) { /* noop */ }
  }

  async function load() {
    await loadEncounters();
    try {
      const r = await fetch('/api/data/_rlt/identity');
      if (r.ok) {
        const data = await r.json();
        const id = data?.my_id || '';
        const p = players.find(x => x.id === id);
        display(id, p?.name);
      }
    } catch (_) { /* noop */ }
  }

  editBtn.addEventListener('click', openEditor);
  cancelBtn.addEventListener('click', closeEditor);
  clearBtn.addEventListener('click', () => save(''));
  document.addEventListener('click', (e) => {
    if (!strip.contains(e.target)) closeEditor();
  });

  load();
})();

// When the dashboard is embedded inside the RL Toolkit launcher, links
// with target="_blank" can't open a new tab — there's no tab system in
// the launcher's webview. Forward those clicks to the launcher via
// postMessage so it can open the URL in the user's real browser.
const inLauncher = window.parent !== window;
if (inLauncher) {
  document.addEventListener('click', (ev) => {
    const a = ev.target.closest && ev.target.closest('a[target="_blank"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href) return;
    // Resolve relative URLs against the dashboard's origin so the
    // launcher gets an absolute URL to hand to the OS opener.
    let absolute;
    try { absolute = new URL(href, location.href).toString(); }
    catch (_) { return; }
    ev.preventDefault();
    window.parent.postMessage({ type: 'rl-launcher:open-external', url: absolute }, '*');
  });
}

// ─── Overlay surface settings ─────────────────────────────
const surfWInput = document.getElementById('surface-w');
const surfHInput = document.getElementById('surface-h');
const surfSaveBtn = document.getElementById('surface-save');
const surfDetectedBtn = document.getElementById('surface-use-detected');
const surfClearBtn = document.getElementById('surface-clear');
const surfEffLabel = document.getElementById('surface-effective-label');
const surfDetail = document.getElementById('surface-detail');

let surfaceState = null;

async function loadSurfaceSettings() {
  try {
    const r = await fetch('/api/overlay/surface');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    surfaceState = await r.json();
  } catch (err) {
    console.warn('[dashboard] surface fetch failed', err);
    surfaceState = { configured: null, detected: null, effective: { width: 1920, height: 1080 } };
  }
  renderSurfaceSettings();
}

function renderSurfaceSettings() {
  const cfg = surfaceState.configured;
  const det = surfaceState.detected;
  const eff = surfaceState.effective;
  surfWInput.value = cfg ? cfg.width : eff.width;
  surfHInput.value = cfg ? cfg.height : eff.height;
  surfEffLabel.textContent = eff.width + ' × ' + eff.height;
  surfDetectedBtn.disabled = !det;
  let detail = '';
  if (det) detail += 'Detected: ' + det.width + ' × ' + det.height + '. ';
  if (cfg && det && (cfg.width !== det.width || cfg.height !== det.height)) {
    detail += '<span class="mismatch">Configured differs from detected.</span>';
  } else if (!cfg) {
    detail += 'No configured size — using ' + (det ? 'detected' : 'fallback') + '.';
  }
  surfDetail.innerHTML = detail;
}

async function putSurface(body) {
  const r = await fetch('/api/overlay/surface', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const msg = (await r.text()).trim();
    throw new Error('HTTP ' + r.status + ': ' + msg);
  }
  surfaceState = await r.json();
  renderSurfaceSettings();
}

surfSaveBtn.addEventListener('click', async () => {
  const w = parseInt(surfWInput.value, 10);
  const h = parseInt(surfHInput.value, 10);
  if (!w || !h) {
    alert('Width and height must be positive integers.');
    return;
  }
  try {
    await putSurface({ width: w, height: h });
  } catch (err) {
    alert('Save failed: ' + err.message);
  }
});

surfDetectedBtn.addEventListener('click', async () => {
  if (!surfaceState.detected) return;
  try {
    await putSurface({ width: surfaceState.detected.width, height: surfaceState.detected.height });
  } catch (err) {
    alert('Save failed: ' + err.message);
  }
});

surfClearBtn.addEventListener('click', async () => {
  try {
    await putSurface(null);
  } catch (err) {
    alert('Clear failed: ' + err.message);
  }
});

loadSurfaceSettings();
</script>
