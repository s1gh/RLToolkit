<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RL Toolkit — Overlay</title>
<script>
  // Editor mode wants a dark backdrop so widget chrome reads against
  // something solid; production overlay must stay transparent so the
  // game shows through. Set the editor color synchronously here in
  // <head> so the first paint is dark — overlay-editor.js used to do
  // this from JS later, which left a white flash on full-page reloads
  // (Reset all, plugin enable/disable). Toggling the html.edit class
  // also lets the static CSS rule below pick the right background.
  if (new URLSearchParams(location.search).get('edit') === '1') {
    document.documentElement.classList.add('edit');
  }
</script>
<style>
  html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
  html.edit, html.edit body{background:#0a0c14}
  .pf{position:absolute;border:none;background:transparent}
</style></head><body><script>
// Shallow-merge per-user overrides on top of each plugin's manifest
// overlay block. Manifests are author-controlled defaults; overrides are
// user-controlled customizations stored in data/overlay-overrides.json.
// Reflows in place when the editor publishes _OverridesChanged — no
// full reload, no iframe re-mount, plugin in-memory state survives.
//
// Shared SSE bus: this aggregator opens ONE EventSource subscribed to
// the union of every hosted plugin's wanted events, parses each message
// once, and fans the parsed envelope to every iframe via postMessage.
// Each iframe's SDK runs in hosted-bus mode (detected via the
// __rlt_hosted=1 URL flag we add below) and skips opening its own
// EventSource. Saves N TCP connections, N JSON parses per event, and
// N reconnect storms when the toolkit briefly drops.
(async function(){
  const params = new URLSearchParams(location.search);
  const editMode = params.get('edit') === '1';

  let plugins = await fetch('/api/plugins').then(r => r.json());
  const overrides = await fetch('/api/overlay/overrides').then(r => r.json()).catch(() => ({}));

  function mergeConfig(pluginList, overridesMap) {
    return pluginList
      .filter(p => p.overlay?.file)
      .map(p => ({
        plugin: p,
        overlay: Object.assign({}, p.overlay, overridesMap[p.name] || {}),
      }));
  }

  async function reflow(overridesMap) {
    plugins = await fetch('/api/plugins').then(r => r.json()).catch(() => plugins);
    applyConfig(mergeConfig(plugins, overridesMap));
  }

  const merged = mergeConfig(plugins, overrides);

  if (editMode) {
    // Hand off to the editor. It reads window.__rltOverlayContext for the
    // resolved overlay config + raw plugin list, then takes over rendering
    // (production iframe placement, edit chrome, drag handlers, etc.).
    window.__rltOverlayContext = { merged, plugins, overrides };
    const s = document.createElement('script');
    s.src = '/overlay-editor.js';
    document.body.appendChild(s);
    return;
  }

  // Production path: track each iframe by plugin name so reflow can
  // re-apply position/size/opacity in place without re-mounting (which
  // would reset plugin in-memory state mid-stream).
  //   widgets: plugin.name -> { el, iframe, wantedEvents: Set<string> }
  // wantedEvents tracks the per-iframe filter set (sent by the SDK in
  // its hosted-mode hello + subsequent addEvent messages).
  const widgets = new Map();

  // ─── Game-focus relay ──────────────────────────────────────
  //
  // The rl-widget Rust process pushes focus signals via webview.eval,
  // which evaluates in THIS top-level document only — never inside
  // iframes. We forward each signal to every plugin iframe so the
  // SDK's `RLT.focus.onChange` listener (which lives inside the
  // iframe) fires.
  //
  // Edge case: the focus watcher is edge-triggered (only emits on
  // transition). If the initial "RL is foreground" transition fires
  // before an iframe finishes loading its SDK, the message is lost.
  // We remember the last signal and replay it on iframe `load` (see
  // applyOne below).
  let lastFocus = null; // null until the first signal arrives

  // ─── Shared bus: cached framing events for late-mount replay ──
  //
  // _Lifecycle and _ConnectionStatus are framing signals every SDK
  // expects to see at startup. The toolkit's server pushes the current
  // value on every connect, so we always have one in hand. Cache the
  // last one and re-post to each iframe on its `load` so a plugin that
  // mounts after the initial signals still hydrates correctly.
  let lastLifecycle = null;
  let lastStatus = null;
  // _RosterChanged is edge-triggered (only emits when the roster
  // fingerprint moves), so a plugin mounting mid-match would
  // otherwise never see the current roster. Cache the last one and
  // replay on iframe load + bus_hello, same convention as lifecycle.
  let lastRoster = null;
  // Current match phase, tracked from incoming _MatchState envelopes.
  // Used to decide whether plugins with `unmount_outside_phase: true`
  // should currently be mounted. 'none' is the default until the
  // first _MatchState arrives.
  let currentPhase = 'none';
  // Last merged config used by applyConfig, kept so we can re-apply
  // it on phase change without re-fetching /api/plugins.
  let lastMerged = null;

  // ─── Hello / addEvent inbox from iframes ──────────────────
  //
  // Every hosted-mode SDK posts:
  //   { __rlt_bus_hello__: true, events: [...] } once at boot
  //   { __rlt_bus_addEvent__: true, name: "Foo" } each time a plugin
  //       handler subscribes to a new event after boot.
  // We union these across all iframes to decide what our shared
  // EventSource asks the server for. Required-baseline events
  // (lifecycle transitions) are always in the set so the server
  // delivers them regardless of plugin opt-in.
  const REQUIRED_EVENTS = [
    'MatchCreated','MatchInitialized','CountdownBegin','RoundStarted',
    'MatchPaused','MatchUnpaused','GoalReplayStart','GoalReplayWillEnd',
    'GoalReplayEnd','MatchEnded','PodiumStart','MatchDestroyed','ReplayCreated',
    '_OverridesChanged',
  ];
  // Synthetic _OverridesChanged is in the list so reflow events are
  // delivered when no plugin opted into anything else; the server
  // bypasses the filter for _-prefixed names, but listing it here makes
  // the URL non-empty and survives a server change to that policy.

  function unionWantedEvents() {
    const set = new Set(REQUIRED_EVENTS);
    for (const w of widgets.values()) {
      for (const ev of w.wantedEvents) set.add(ev);
    }
    return set;
  }

  // ─── Shared SSE bus ──────────────────────────────────────
  //
  // One EventSource for the whole aggregator. Filter is the union of
  // every iframe's wanted-event set. When an iframe asks for a new
  // event, we close + reopen with the wider filter. Cheap on localhost.
  let es = null;
  let lastFilterUrl = '';

  function buildEventsURL(set) {
    const list = Array.from(set).join(',');
    return '/events?events=' + encodeURIComponent(list);
  }

  function openBus() {
    const wanted = unionWantedEvents();
    const url = buildEventsURL(wanted);
    if (es && url === lastFilterUrl) return;
    if (es) {
      try { es.close(); } catch (_) { /* noop */ }
      es = null;
    }
    lastFilterUrl = url;
    es = new EventSource(url);
    es.onmessage = (e) => {
      let env;
      try { env = JSON.parse(e.data); } catch (_) { return; }
      if (!env) return;

      // Reflow event: handled here, NOT forwarded to plugins.
      if (env.Event === '_OverridesChanged') {
        reflow(env.Data || {});
        return;
      }

      // Cache framing signals for late-mount replay.
      if (env.Event === '_Lifecycle') {
        lastLifecycle = env;
        // No active match → drop the cached roster so a plugin
        // mounting between matches doesn't see a stale list. The
        // server-side RosterTracker stops emitting once a match
        // ends, but lastRoster would otherwise hang around.
        if (env.match_active === false) lastRoster = null;
      }
      if (env.Event === '_ConnectionStatus') {
        lastStatus = env;
        if (env.Status !== 'connected') lastRoster = null;
      }
      if (env.Event === '_RosterChanged') lastRoster = env;
      // Phase-driven mount/unmount: any plugin with
      // unmount_outside_phase + show_during_phase needs the aggregator
      // itself to know the current phase. Re-apply config on every
      // change so the iframe set matches the active phase.
      if (env.Event === '_MatchState' && env.Data && env.Data.phase) {
        const next = env.Data.phase;
        if (next !== currentPhase) {
          currentPhase = next;
          if (lastMerged) applyConfig(lastMerged);
        }
      }

      // Fan to every iframe. Each iframe's SDK filters client-side
      // against its own subscribedEvents set; the parent broadcasts
      // the union, so any iframe might receive an event it didn't
      // personally ask for and silently drop it.
      for (const w of widgets.values()) {
        const cw = w.iframe?.contentWindow;
        if (!cw) continue;
        try { cw.postMessage({ __rlt_bus__: true, msg: env }, '*'); }
        catch (_) { /* noop: navigating / cross-origin */ }
      }
    };
    let firstOpenInner = true;
    es.onopen = () => {
      if (firstOpenInner) { firstOpenInner = false; return; }
      // After a reconnect, re-fetch overrides so we catch up on
      // anything the editor changed while we were down.
      fetch('/api/overlay/overrides')
        .then(r => r.json())
        .then(o => reflow(o))
        .catch((err) => console.warn('[rlt overlay] resync failed', err));
    };
    es.onerror = (e) => {
      console.warn('[rlt overlay] SSE connection lost; auto-reconnecting', e);
    };
  }

  // ─── postMessage inbox: focus signals + bus chatter ───────
  window.addEventListener('message', (e) => {
    const data = e?.data;
    if (!data) return;

    // Focus signal from the rl-widget Rust process (lands in this
    // top-level doc only).
    if (data.__rlt_focus__ === true) {
      lastFocus = !!data.active;
      for (const { iframe } of widgets.values()) {
        if (!iframe?.contentWindow) continue;
        try { iframe.contentWindow.postMessage(data, '*'); }
        catch (_) { /* noop */ }
      }
      return;
    }

    // Hosted-mode SDK announcing its initial filter set. Find which
    // iframe this came from so we can attribute the events correctly.
    if (data.__rlt_bus_hello__ === true) {
      const w = widgetForSource(e.source);
      if (!w) return;
      w.wantedEvents = new Set(Array.isArray(data.events) ? data.events : []);
      openBus(); // re-open with the new union
      // Replay framing signals so the plugin's lifecycle/status state
      // is correct before the next live event arrives.
      if (lastLifecycle) {
        try { e.source.postMessage({ __rlt_bus__: true, msg: lastLifecycle }, '*'); }
        catch (_) { /* noop */ }
      }
      if (lastStatus) {
        try { e.source.postMessage({ __rlt_bus__: true, msg: lastStatus }, '*'); }
        catch (_) { /* noop */ }
      }
      if (lastRoster) {
        try { e.source.postMessage({ __rlt_bus__: true, msg: lastRoster }, '*'); }
        catch (_) { /* noop */ }
      }
      return;
    }

    // Hosted-mode SDK adding a single event to its filter post-boot.
    if (data.__rlt_bus_addEvent__ === true && typeof data.name === 'string') {
      const w = widgetForSource(e.source);
      if (!w) return;
      if (w.wantedEvents.has(data.name)) return;
      w.wantedEvents.add(data.name);
      openBus();
      return;
    }
  });

  function widgetForSource(source) {
    if (!source) return null;
    for (const w of widgets.values()) {
      if (w.iframe && w.iframe.contentWindow === source) return w;
    }
    return null;
  }

  function applyOne(plugin, overlay) {
    let w = widgets.get(plugin.name);
    if (!w) {
      const f = document.createElement('iframe');
      f.className = 'pf';
      // hide_when_unfocused / show_during_phase: forwarded as URL flags
      // so the SDK can synchronously default-hide the body before first
      // paint, no manifest-fetch race. Editor preview deliberately does
      // NOT forward these — the user is editing in the dashboard tab
      // where RL isn't focused and there's no real lifecycle phase, so
      // hiding every widget there makes the editor unusable.
      //
      // __rlt_hosted=1 is the handshake flag the SDK reads to know it
      // should run in hosted-bus mode (no own EventSource; receive
      // events via postMessage from this aggregator).
      let src = '/plugins/' + plugin.name + '/' + overlay.file +
                '?__rlt_hosted=1&anchor=' + encodeURIComponent(overlay.anchor || 'top-right');
      if (overlay.hide_when_unfocused) src += '&hide_when_unfocused=1';
      if (Array.isArray(overlay.show_during_phase) && overlay.show_during_phase.length) {
        src += '&phases=' + encodeURIComponent(overlay.show_during_phase.join(','));
      }
      f.src = src;
      f.setAttribute('allowtransparency', 'true');
      f.setAttribute('frameborder', '0');
      // On iframe `load` the SDK has just installed its message
      // listener; replay focus + framing signals so a late-mounting
      // plugin starts in the right state. The bus_hello path also
      // replays lifecycle/status, but `load` may fire BEFORE hello if
      // the SDK's microtask hasn't run yet, so we belt-and-braces here.
      f.addEventListener('load', () => {
        const cw = f.contentWindow;
        if (!cw) return;
        if (lastFocus !== null) {
          try { cw.postMessage({ __rlt_focus__: true, active: lastFocus }, '*'); }
          catch (_) { /* noop */ }
        }
        if (lastLifecycle) {
          try { cw.postMessage({ __rlt_bus__: true, msg: lastLifecycle }, '*'); }
          catch (_) { /* noop */ }
        }
        if (lastStatus) {
          try { cw.postMessage({ __rlt_bus__: true, msg: lastStatus }, '*'); }
          catch (_) { /* noop */ }
        }
        if (lastRoster) {
          try { cw.postMessage({ __rlt_bus__: true, msg: lastRoster }, '*'); }
          catch (_) { /* noop */ }
        }
      });
      document.body.appendChild(f);
      w = { el: f, iframe: f, wantedEvents: new Set() };
      widgets.set(plugin.name, w);
    }
    const a = overlay.anchor || 'top-right';
    w.el.style.width  = overlay.width  + 'px';
    w.el.style.height = overlay.height + 'px';
    w.el.style.opacity = overlay.opacity == null ? 1 : overlay.opacity;
    // Anchor change: clear all four sides, re-apply the two we want.
    w.el.style.top = w.el.style.bottom = w.el.style.left = w.el.style.right = '';
    const ox = (overlay.offset_x || 0) + 'px';
    const oy = (overlay.offset_y || 0) + 'px';
    if (a.indexOf('top')   === 0) w.el.style.top  = oy; else w.el.style.bottom = oy;
    if (a.indexOf('-left') >= 0)  w.el.style.left = ox; else w.el.style.right  = ox;
    // Always pass mouse through to whatever's beneath the overlay.
    // The hosting Tauri window is OS-level click-through; this keeps
    // the same behavior when /overlay is loaded outside Tauri (OBS,
    // standalone browser tab) so plugins don't need to opt in.
    w.el.style.pointerEvents = 'none';
  }

  function unmount(name) {
    const w = widgets.get(name);
    if (!w) return;
    if (w.el?.parentNode) w.el.parentNode.removeChild(w.el);
    widgets.delete(name);
    // Filter union shrinks — reopen so the server stops sending events
    // no remaining iframe wants.
    openBus();
  }

  function applyConfig(mergedList) {
    lastMerged = mergedList;
    const wanted = new Set();
    for (const { plugin, overlay } of mergedList) {
      const enabled = overlay.enabled === true;
      if (!enabled) {
        unmount(plugin.name);
        continue;
      }
      // Hard phase gate: opt-in (unmount_outside_phase + non-empty
      // show_during_phase). When the current phase isn't in the set,
      // skip mounting — the bus filter will shrink so the plugin
      // doesn't even receive events. Re-mounted on phase change via
      // the SSE _MatchState handler above.
      const phaseList = Array.isArray(overlay.show_during_phase)
        ? overlay.show_during_phase
        : null;
      const hardGate = !!overlay.unmount_outside_phase && phaseList && phaseList.length > 0;
      if (hardGate && !phaseList.includes(currentPhase)) {
        unmount(plugin.name);
        continue;
      }
      wanted.add(plugin.name);
      applyOne(plugin, overlay);
    }
    // Catch plugins that were dropped from the merged list (e.g.,
    // uninstalled between page-load and a reflow event) — also unmount.
    for (const name of widgets.keys()) {
      if (!wanted.has(name)) unmount(name);
    }
  }

  applyConfig(merged);
  // Open the shared bus with the baseline filter. Each iframe's
  // hosted-mode hello will widen it as their handlers register.
  openBus();

  // Pre-hide flush. Stale-buffer flash on layer-shell remap is caused
  // by WebKit's last-produced buffer being re-attached on map after
  // hide; if the user mutated the DOM (e.g. disabled a plugin) while
  // the document was hidden, those mutations did not reach a paint
  // (per the Page Visibility / "update the rendering" spec gating),
  // so the cached buffer still contains the pre-mutation state and
  // flashes for one frame on the next show().
  //
  // Fix: the Tauri side asks us to clear the page BEFORE it calls
  // hide(), and waits for the resulting paint to land (rAF) before
  // unmapping the surface. With the buffer cleared while still
  // visible, whatever the compositor presents on remap is empty,
  // not stale. Sequence on the Tauri side:
  //   1. evaluate __rlt_prepare_for_hide(); on the webview
  //   2. await its returned promise (resolves after one paint)
  //   3. call window.hide()
  // On show() we just resume from lastMerged; visibilitychange to
  // 'visible' handles the remount path so iframes come back.
  window.__rlt_prepare_for_hide = function () {
    for (const name of Array.from(widgets.keys())) unmount(name);
    return new Promise((resolve) => {
      // Two rAFs: the first runs the style/layout for the now-empty
      // DOM, the second guarantees that frame has been presented to
      // the compositor before we resolve. wl_surface state is double-
      // buffered and replaced atomically at commit, so the post-rAF
      // commit is what GTK will hand the compositor.
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });
  };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && lastMerged) applyConfig(lastMerged);
  });

  // Live edit hook (Phase 2+).
  // The Tauri host calls window.__rlt_set_live_edit(true|false) via
  // webview.eval to toggle the page's drag wrappers. The actual JS
  // module is lazy-imported on first activation so the production
  // overlay never loads it.
  let liveEditModule = null;
  window.__rlt_set_live_edit = async function(on) {
    if (on && !liveEditModule) {
      try {
        await import('/overlay-live-edit.js');
        liveEditModule = window.__rlt_live_edit;
      } catch (err) {
        console.error('[rlt overlay] live-edit module load failed', err);
        try {
          window.__TAURI_INTERNALS__?.invoke('overlay_edit_module_failed', { reason: String(err) });
        } catch (_) { /* not running inside Tauri */ }
        return;
      }
    }
    if (on) liveEditModule?.mount(widgets);
    else liveEditModule?.unmount();
  };

  // Diagnostic: report the actual rendered viewport so we can verify
  // it matches what the editor's target says it should be. If they
  // diverge, bottom-anchored widgets clip below the screen.
  console.log('[rlt overlay] viewport',
    window.innerWidth + 'x' + window.innerHeight,
    'dpr=' + window.devicePixelRatio,
    'screen=' + screen.width + 'x' + screen.height);
})().catch((err) => {
  // OBS browser sources can't show toasts; at least log so the failure
  // is visible in the source's "Inspect" devtools.
  console.error('[rlt overlay]', err);
});
</script></body></html>
