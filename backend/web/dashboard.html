<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RL Toolkit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Surfaces */
  --bg-0:#08090f; --bg-1:#0f1117; --bg-2:#161922; --bg-3:#1f232f;
  --line:#252938; --line-2:#363b4d;

  /* Text */
  --txt:#e9ecf2; --txt-2:#a6abbf; --txt-3:#6c7286;

  /* Accents */
  --cyan:#22d3ee;   --cyan-glow:rgba(34,211,238,0.35);
  --violet:#a78bfa; --violet-glow:rgba(167,139,250,0.35);
  --green:#22c55e;
  --gold:#fbbf24;
  --rose:#f472b6;

  /* Type */
  --display:'Inter Tight', system-ui, sans-serif;
  --ui:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--ui); font-size:14px; color:var(--txt);
  background:
    radial-gradient(1400px 700px at 85% -10%, rgba(167,139,250,0.10), transparent 60%),
    radial-gradient(1100px 550px at -10% 110%, rgba(34,211,238,0.07), transparent 60%),
    var(--bg-0);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  letter-spacing:-0.005em;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ─── Layout ───────────────────────────────────────────────── */
.shell{
  max-width:1280px; margin:0 auto;
  padding:24px 32px 40px;
}
@media (max-width:720px){ .shell{ padding:20px 18px 32px; } }

/* ─── Topbar ───────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 4px 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand .logo{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  box-shadow: 0 8px 24px -8px var(--violet-glow);
}
.brand h1{
  font-family:var(--display); font-weight:800;
  font-size:22px; letter-spacing:-0.025em; line-height:1;
  color:#fff;
}
.brand .tag{
  font-size:12px; color:var(--txt-3);
  margin-top:3px; letter-spacing:0;
}

.conn{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 14px;
  background:var(--bg-2); border:1px solid var(--line);
  border-radius:99px;
  font-size:12px; font-weight:600;
  color:var(--txt-2);
  letter-spacing:0;
}
.conn::before{
  content:''; width:7px; height:7px; border-radius:50%;
  background:var(--txt-3);
}
.conn[data-status="connected"]    { color:#fff; }
.conn[data-status="connected"]::before{
  background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.18);
  animation:pulse 2.4s ease-in-out infinite;
}
.conn[data-status="connecting"]::before{ background:var(--gold); }
.conn[data-status="disconnected"]::before{ background:#ef4444; }
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 3px rgba(34,197,94,.16); }
  50%   { box-shadow:0 0 0 6px rgba(34,197,94,.04); }
}

/* ─── Section heading ──────────────────────────────────────── */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 4px 4px 16px;
}
.section-head h2{
  font-family:var(--display); font-weight:600;
  font-size:18px; letter-spacing:-0.015em; line-height:1;
  color:var(--txt);
}
.section-head .count{
  font-family:var(--mono); font-size:12px;
  color:var(--txt-3);
  font-feature-settings:'tnum';
}

/* ─── Plugin grid ──────────────────────────────────────────── */
.plugins{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap:14px;
  margin-bottom:48px;
}

.card{
  position:relative;
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2) 110%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 22px 18px;
  display:flex; flex-direction:column; gap:14px;
  min-height:200px;
  overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(360px 200px at 100% 0%, rgba(167,139,250,0.08), transparent 60%);
  opacity:0; transition:opacity .25s ease;
  pointer-events:none;
}
.card::after{
  content:''; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
  opacity:0; transition:opacity .25s ease;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--line-2);
  box-shadow:0 24px 48px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(167,139,250,.12);
}
.card:hover::before, .card:hover::after{ opacity:1; }

.card-head{ display:flex; align-items:center; gap:12px; }
.card-icon{
  width:44px; height:44px; border-radius:11px;
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:15px;
  color:var(--bg-0); letter-spacing:-0.02em;
  flex-shrink:0;
}
.card-meta{ flex:1; min-width:0; }
.card-title{
  font-family:var(--display); font-weight:700;
  font-size:18px; letter-spacing:-0.015em; line-height:1.2;
  color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-sub{
  display:flex; align-items:center; gap:8px;
  margin-top:4px;
  font-size:12px; color:var(--txt-3);
}
.card-sub .v{
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:0.06em;
  background:var(--bg-3); border:1px solid var(--line);
  padding:2px 8px; border-radius:99px;
  color:var(--txt-2);
}
.card-sub .author{
  font-family:var(--mono); color:var(--txt-3);
}

.card-desc{
  font-size:13px; line-height:1.55;
  color:var(--txt-2);
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-actions{ display:flex; gap:6px; }
.btn{
  flex:1;
  font-family:var(--ui); font-size:12px; font-weight:600;
  letter-spacing:0;
  padding:10px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg-3); color:var(--txt);
  cursor:pointer;
  transition:all .15s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.btn.primary{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  color:var(--bg-0); border-color:transparent; font-weight:700;
}
.btn.primary:hover{
  filter:brightness(1.08);
  box-shadow:0 8px 24px -8px var(--cyan-glow), 0 8px 24px -8px var(--violet-glow);
  color:var(--bg-0);
}
.btn .arrow{ font-size:11px; transition:transform .2s ease; }
.btn.primary:hover .arrow{ transform:translateX(2px); }

/* ─── Per-plugin toggle ────────────────────────────────────── */
/* Toggle in the card head, opposite the icon. Visually obvious so
   the user can see which plugins are active at a glance. The card
   itself dims to ~60% when disabled so the inactive set reads
   instantly across a long list. */
.card.disabled{ opacity:0.6; }
.card.disabled .card-icon{ filter:grayscale(0.7); }
.card-head{ position:relative; }
.toggle{
  position:absolute; top:0; right:0;
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; color:var(--txt-3);
  text-transform:uppercase; letter-spacing:0.06em; font-weight:600;
  cursor:pointer; user-select:none;
}
.toggle input{ position:absolute; opacity:0; pointer-events:none; }
.toggle .knob{
  width:32px; height:18px; background:var(--bg-3);
  border:1px solid var(--line); border-radius:99px;
  position:relative; transition:all .15s ease;
}
.toggle .knob::after{
  content:''; position:absolute; top:1px; left:1px;
  width:14px; height:14px; border-radius:50%;
  background:var(--txt-3); transition:all .15s ease;
}
.toggle input:checked + .knob{
  background:linear-gradient(135deg, var(--cyan), var(--violet));
  border-color:transparent;
}
.toggle input:checked + .knob::after{
  left:15px; background:var(--bg-0);
}

/* ─── Empty state ──────────────────────────────────────────── */
.empty{
  grid-column:1 / -1;
  background:var(--bg-1); border:1px dashed var(--line-2);
  border-radius:14px;
  padding:48px 32px; text-align:center;
}
.empty .em-icon{
  width:48px; height:48px; margin:0 auto 14px;
  border-radius:12px;
  background:var(--bg-3); border:1px solid var(--line);
  display:grid; place-items:center;
  font-size:22px; color:var(--txt-3);
}
.empty h3{
  font-family:var(--display); font-weight:700; font-size:18px;
  letter-spacing:-0.015em; color:#fff; margin-bottom:6px;
}
.empty p{ color:var(--txt-3); font-size:13px; max-width:380px; margin:0 auto; line-height:1.55; }
.empty code{
  font-family:var(--mono); font-size:12px;
  color:var(--cyan);
  background:var(--bg-3); padding:1px 6px; border-radius:4px;
}

/* ─── Footer ribbon ────────────────────────────────────────── */
.ribbon{
  border-top:1px solid var(--line);
  padding-top:16px; margin-top:8px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:11px; color:var(--txt-3);
  font-family:var(--mono);
}
.ribbon .label{
  text-transform:uppercase; letter-spacing:0.16em;
  color:var(--txt-3);
  font-family:var(--ui); font-weight:600;
  margin-right:4px;
}
.ribbon a{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:99px;
  border:1px solid var(--line);
  color:var(--txt-2);
  transition:all .15s ease;
}
.ribbon a:hover{
  border-color:var(--cyan); color:var(--cyan);
}
.ribbon a .dot{
  width:5px; height:5px; border-radius:50%;
  background:var(--txt-3);
  transition:background .15s ease;
}
.ribbon a:hover .dot{ background:var(--cyan); box-shadow:0 0 6px var(--cyan-glow); }

/* ─── Settings modal ───────────────────────────────────────── */
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(8,9,15,0.78);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center; justify-content:center;
  z-index:1000;
}
.modal-backdrop.open{ display:flex; }
.modal{
  width:min(720px, 90vw);
  height:min(620px, 80vh);
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.modal-head h3{
  font-family:var(--display); font-weight:700;
  font-size:15px; letter-spacing:-0.01em;
  color:var(--txt);
}
.modal-close{
  width:30px; height:30px; border-radius:8px;
  background:var(--bg-3); color:var(--txt-2);
  border:1px solid var(--line);
  cursor:pointer; font-size:16px; line-height:1;
  display:grid; place-items:center;
  transition:all .15s ease;
}
.modal-close:hover{ color:var(--txt); border-color:var(--line-2); }
.modal-body{
  flex:1; min-height:0;
}
.modal-body iframe{
  width:100%; height:100%;
  border:0; display:block;
  background:var(--bg-0);
}
</style>
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="logo">RL</div>
      <div>
        <h1>RL Toolkit</h1>
        <div class="tag">Stats API · Plugin Host</div>
      </div>
    </div>
    <span class="conn" id="conn" data-status="disconnected">disconnected</span>
  </header>

  <section>
    <div class="section-head">
      <h2>Plugins</h2>
      <span class="count" id="stat-count">0</span>
    </div>
    <div class="plugins" id="pl"></div>
  </section>

  <footer class="ribbon">
    <span class="label">Endpoints</span>
    <a href="/overlay" target="_blank"><span class="dot"></span>/overlay</a>
    <a href="/overlay?edit=1" target="_blank"><span class="dot"></span>/overlay?edit=1</a>
    <a href="/events" target="_blank"><span class="dot"></span>/events</a>
    <a href="/api/plugins" target="_blank"><span class="dot"></span>/api/plugins</a>
    <a href="/api/status" target="_blank"><span class="dot"></span>/api/status</a>
    <a href="/api/lifecycle" target="_blank"><span class="dot"></span>/api/lifecycle</a>
    <a href="/api/metrics" target="_blank"><span class="dot"></span>/api/metrics</a>
    <a href="/api/events" target="_blank"><span class="dot"></span>/api/events</a>
  </footer>

</div>

<div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" role="document">
    <div class="modal-head">
      <h3 id="settings-modal-title">Settings</h3>
      <button class="modal-close" type="button" data-role="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <iframe id="settings-modal-frame" title="Plugin settings"></iframe>
    </div>
  </div>
</div>

<script>
'use strict';

// ─── Connection pill — short polling, no SSE ───────────────
// Dashboard is a launcher, not a monitor. /api/status every few seconds is
// plenty, and avoids the long-lived SSE connection (which Firefox warns
// about whenever you navigate away).
const conn = document.getElementById('conn');
async function pingStatus() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    const j = await r.json();
    conn.dataset.status = j.rl_api || 'disconnected';
    conn.textContent = j.rl_api || 'disconnected';
  } catch {
    conn.dataset.status = 'disconnected';
    conn.textContent = 'disconnected';
  }
}
pingStatus();
setInterval(pingStatus, 5000);

// ─── Plugin list ───────────────────────────────────────────
// Fetch plugins + overrides together so the per-card enabled toggle
// renders with the correct initial state. Subscribes to _OverridesChanged
// (synthetic, bypasses the SSE filter) so toggling from another tab —
// or from /overlay?edit=1 — re-renders the list in place.
let plugins = [];
let overrides = {};

Promise.all([
  fetch('/api/plugins').then(r => r.json()).catch(() => []),
  fetch('/api/overlay/overrides').then(r => r.json()).catch(() => ({})),
]).then(([ps, ov]) => {
  plugins = ps || [];
  overrides = ov || {};
  renderPlugins();

  const es = new EventSource('/events?events=__none__');
  es.onmessage = (e) => {
    let env;
    try { env = JSON.parse(e.data); } catch (_) { return; }
    if (!env || env.Event !== '_OverridesChanged') return;
    overrides = env.Data || {};
    renderPlugins();
  };
});

function isEnabled(name) {
  const ov = overrides[name];
  return !ov || ov.enabled !== false;
}

function renderPlugins() {
  const c = document.getElementById('pl');
  document.getElementById('stat-count').textContent = plugins.length;

  if (plugins.length === 0) {
    c.innerHTML = '<div class="empty">'
      + '<div class="em-icon">◇</div>'
      + '<h3>No plugins yet</h3>'
      + '<p>Drop a folder with <code>manifest.json</code> + <code>overlay.html</code> into your <code>plugins/</code> directory and refresh.</p>'
      + '</div>';
    return;
  }

  c.innerHTML = plugins.map(p => {
    const overlay = p.overlay?.file
      ? '/plugins/' + p.name + '/' + p.overlay.file
      : null;
    const initials = (p.title || p.name || '?').replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || '◇';
    const desc = p.description
      ? esc(p.description)
      : '<span style="color:var(--txt-3);font-style:italic">No description provided.</span>';
    const enabled = isEnabled(p.name);

    return '<article class="card' + (enabled ? '' : ' disabled') + '" data-plugin="' + esc(p.name) + '">'
      + '<div class="card-head">'
        + '<div class="card-icon">' + esc(initials) + '</div>'
        + '<div class="card-meta">'
          + '<div class="card-title">' + esc(p.title || p.name) + '</div>'
          + '<div class="card-sub">'
            + (p.version ? '<span class="v">v' + esc(p.version) + '</span>' : '')
            + (p.author ? '<span class="author">@' + esc(p.author) + '</span>' : '')
          + '</div>'
        + '</div>'
        + '<label class="toggle" title="' + (enabled ? 'Disable' : 'Enable') + ' overlay">'
          + '<input type="checkbox" data-role="enabled"' + (enabled ? ' checked' : '') + '>'
          + '<span class="knob"></span>'
        + '</label>'
      + '</div>'
      + '<p class="card-desc">' + desc + '</p>'
      + '<div class="card-actions">'
        + (overlay ? '<a class="btn primary" href="' + overlay + '" target="_blank">Open <span class="arrow">→</span></a>' : '')
        + (p.settings ? '<button class="btn" data-role="settings" type="button">Settings</button>' : '')
      + '</div>'
    + '</article>';
  }).join('');

  // Wire toggles
  c.querySelectorAll('.card').forEach(card => {
    const name = card.getAttribute('data-plugin');
    const cb = card.querySelector('input[data-role="enabled"]');
    cb.addEventListener('change', () => setEnabled(name, cb.checked, cb));
    const settingsBtn = card.querySelector('button[data-role="settings"]');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', () => openSettingsModal(name));
    }
  });
}

async function setEnabled(name, enabled, cb) {
  try {
    const r = await fetch('/api/overlay/overrides/' + encodeURIComponent(name), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // The SSE _OverridesChanged event will re-render. No optimistic
    // local mutation needed — keeps the dashboard's view of overrides
    // exactly in sync with the server's.
  } catch (err) {
    cb.checked = !enabled; // roll back the visible toggle
    console.error('[dashboard] toggle failed', err);
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ─── Settings modal ────────────────────────────────────────
const settingsModal = document.getElementById('settings-modal');
const settingsModalTitle = document.getElementById('settings-modal-title');
const settingsModalFrame = document.getElementById('settings-modal-frame');

function openSettingsModal(pluginName) {
  const p = plugins.find(x => x.name === pluginName);
  if (!p || !p.settings) return;
  const customTitle = (typeof p.settings === 'object' && p.settings.title) ? p.settings.title : null;
  settingsModalTitle.textContent = customTitle || ((p.title || p.name) + ' — Settings');
  const overlayFile = p.overlay?.file || 'overlay.html';
  settingsModalFrame.src = '/plugins/' + encodeURIComponent(p.name) + '/' + overlayFile + '?settings=1';
  settingsModal.classList.add('open');
  settingsModal.setAttribute('aria-hidden', 'false');
}

function closeSettingsModal() {
  settingsModal.classList.remove('open');
  settingsModal.setAttribute('aria-hidden', 'true');
  // Clear src so the previous plugin's view is unloaded; otherwise the
  // next open might race against an already-running iframe.
  settingsModalFrame.src = 'about:blank';
}

settingsModal.querySelector('[data-role="modal-close"]').addEventListener('click', closeSettingsModal);

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) closeSettingsModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsModal.classList.contains('open')) closeSettingsModal();
});

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === 'rlt:settings:close') closeSettingsModal();
});
</script>
</body></html>
