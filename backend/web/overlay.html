<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RL Toolkit — Overlay</title>
<style>
  html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
  .pf{position:absolute;border:none;background:transparent}
</style></head><body><script>
// Shallow-merge per-user overrides on top of each plugin's manifest
// overlay block. Manifests are author-controlled defaults; overrides are
// user-controlled customizations stored in data/overlay-overrides.json.
// Reflows in place when the editor publishes _OverridesChanged — no
// full reload, no iframe re-mount, plugin in-memory state survives.
(async function(){
  const params = new URLSearchParams(location.search);
  const editMode = params.get('edit') === '1';

  const [plugins, overrides] = await Promise.all([
    fetch('/api/plugins').then(r => r.json()),
    fetch('/api/overlay/overrides').then(r => r.json()).catch(() => ({})),
  ]);

  // Build the final overlay config per plugin: manifest first, override on top.
  function mergeConfig(overridesMap) {
    return plugins
      .filter(p => p.overlay?.file)
      .map(p => ({
        plugin: p,
        overlay: Object.assign({}, p.overlay, overridesMap[p.name] || {}),
      }));
  }

  const merged = mergeConfig(overrides);

  if (editMode) {
    // Hand off to the editor. It reads window.__rltOverlayContext for the
    // resolved overlay config + raw plugin list, then takes over rendering
    // (production iframe placement, edit chrome, drag handlers, etc.).
    window.__rltOverlayContext = { merged, plugins, overrides };
    const s = document.createElement('script');
    s.src = '/overlay-editor.js';
    document.body.appendChild(s);
    return;
  }

  // Production path: track each iframe by plugin name so reflow can
  // re-apply position/size/opacity in place without re-mounting (which
  // would reset plugin in-memory state mid-stream).
  const widgets = new Map(); // plugin.name -> { el, iframe }

  // ─── Game-focus relay ──────────────────────────────────────
  //
  // The rl-widget Rust process pushes focus signals via webview.eval,
  // which evaluates in THIS top-level document only — never inside
  // iframes. We forward each signal to every plugin iframe so the
  // SDK's `RLT.focus.onChange` listener (which lives inside the
  // iframe) fires.
  //
  // Edge case: the focus watcher is edge-triggered (only emits on
  // transition). If the initial "RL is foreground" transition fires
  // before an iframe finishes loading its SDK, the message is lost.
  // We remember the last signal and replay it on iframe `load` (see
  // applyOne below).
  let lastFocus = null; // null until the first signal arrives
  window.addEventListener('message', (e) => {
    if (!e?.data || e.data.__rlt_focus__ !== true) return;
    lastFocus = !!e.data.active;
    for (const { iframe } of widgets.values()) {
      if (!iframe?.contentWindow) continue;
      try { iframe.contentWindow.postMessage(e.data, '*'); }
      catch (_) { /* noop: iframe may be navigating or cross-origin */ }
    }
  });

  function applyOne(plugin, overlay) {
    let w = widgets.get(plugin.name);
    if (!w) {
      const f = document.createElement('iframe');
      f.className = 'pf';
      // hide_when_unfocused / show_during_phase: forwarded as URL flags
      // so the SDK can synchronously default-hide the body before first
      // paint, no manifest-fetch race. Editor preview deliberately does
      // NOT forward these — the user is editing in the dashboard tab
      // where RL isn't focused and there's no real lifecycle phase, so
      // hiding every widget there makes the editor unusable.
      let src = '/plugins/' + plugin.name + '/' + overlay.file +
                '?overlay=1&anchor=' + encodeURIComponent(overlay.anchor || 'top-right');
      if (overlay.hide_when_unfocused) src += '&hide_when_unfocused=1';
      if (Array.isArray(overlay.show_during_phase) && overlay.show_during_phase.length) {
        src += '&phases=' + encodeURIComponent(overlay.show_during_phase.join(','));
      }
      f.src = src;
      f.setAttribute('allowtransparency', 'true');
      f.setAttribute('frameborder', '0');
      // Replay the last-known game-focus state to this iframe once its
      // SDK is loaded. The focus watcher is edge-triggered, so a plugin
      // that mounts after the initial "RL is foreground" transition
      // would otherwise stay in its hidden default forever. See the
      // window.onmessage handler below for the broadcast path.
      f.addEventListener('load', () => {
        if (lastFocus !== null && f.contentWindow) {
          try { f.contentWindow.postMessage({ __rlt_focus__: true, active: lastFocus }, '*'); }
          catch (_) { /* noop: iframe may be navigating or cross-origin */ }
        }
      });
      document.body.appendChild(f);
      w = { el: f, iframe: f };
      widgets.set(plugin.name, w);
    }
    const a = overlay.anchor || 'top-right';
    w.el.style.width  = overlay.width  + 'px';
    w.el.style.height = overlay.height + 'px';
    w.el.style.opacity = overlay.opacity == null ? 1 : overlay.opacity;
    // Anchor change: clear all four sides, re-apply the two we want.
    w.el.style.top = w.el.style.bottom = w.el.style.left = w.el.style.right = '';
    const ox = (overlay.offset_x || 0) + 'px';
    const oy = (overlay.offset_y || 0) + 'px';
    if (a.indexOf('top')   === 0) w.el.style.top  = oy; else w.el.style.bottom = oy;
    if (a.indexOf('-left') >= 0)  w.el.style.left = ox; else w.el.style.right  = ox;
    w.el.style.pointerEvents = overlay.click_through ? 'none' : '';
  }

  function unmount(name) {
    const w = widgets.get(name);
    if (!w) return;
    if (w.el?.parentNode) w.el.parentNode.removeChild(w.el);
    widgets.delete(name);
  }

  function applyConfig(mergedList) {
    // Default-true on `enabled`: a plugin without an explicit
    // override is active.
    const wanted = new Set();
    for (const { plugin, overlay } of mergedList) {
      const enabled = overlay.enabled !== false;
      if (!enabled) {
        unmount(plugin.name);
        continue;
      }
      wanted.add(plugin.name);
      applyOne(plugin, overlay);
    }
    // Catch plugins that were dropped from the merged list (e.g.,
    // uninstalled between page-load and a reflow event) — also unmount.
    for (const name of widgets.keys()) {
      if (!wanted.has(name)) unmount(name);
    }
  }

  applyConfig(merged);

  // Subscribe to the SSE bus for live reflow on editor changes. The
  // ?events=__none__ filter would normally suppress everything, but
  // synthetic _-prefixed events bypass the filter on the server side
  // — so we get _OverridesChanged (and _ConnectionStatus, _Lifecycle)
  // without paying the bandwidth of UpdateState's 60-120Hz stream.
  const es = new EventSource('/events?events=__none__');
  es.onmessage = (e) => {
    let env;
    try { env = JSON.parse(e.data); } catch (_) { return; }
    if (!env || env.Event !== '_OverridesChanged') return;
    applyConfig(mergeConfig(env.Data || {}));
  };
  // EventSource auto-reconnects on transport failure. On every successful
  // (re)open AFTER the first, refetch the overrides snapshot so we catch
  // up on changes that happened while the connection was down — without
  // this the overlay would show stale positions until the next edit.
  let firstOpen = true;
  es.onopen = () => {
    if (firstOpen) { firstOpen = false; return; }
    fetch('/api/overlay/overrides')
      .then(r => r.json())
      .then(o => applyConfig(mergeConfig(o)))
      .catch((err) => console.warn('[rlt overlay] resync failed', err));
  };
  es.onerror = (e) => {
    console.warn('[rlt overlay] SSE connection lost; auto-reconnecting', e);
  };
})().catch((err) => {
  // OBS browser sources can't show toasts; at least log so the failure
  // is visible in the source's "Inspect" devtools.
  console.error('[rlt overlay]', err);
});
</script></body></html>
