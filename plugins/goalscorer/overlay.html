<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Last Goal Speed</title>
    <link rel="stylesheet" href="/sdk.css" />
    <script src="/sdk.js" data-plugin="last-goal-speed"></script>
    <style>
      body {
        font-family: var(--rlt-display);
        padding: 16px;
        color: var(--rlt-txt);
        background: var(--rlt-bg-0);
        margin: 0;
      }
      body.overlay-mode {
        background: transparent;
        padding: 0;
      }
      .card {
        background: var(--rlt-bg-1);
        border: 1px solid var(--rlt-line);
        border-radius: 12px;
        padding: 14px 18px;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rlt-txt-3);
      }
      .value {
        font-size: 32px;
        color: var(--rlt-cyan);
      }
      .who {
        font-size: 13px;
        color: var(--rlt-txt-2);
        margin-top: 4px;
      }
      .empty {
        font-style: italic;
        color: var(--rlt-txt-3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label">Last Goal</div>
      <div id="speed" class="value empty">—</div>
      <div id="who" class="who"></div>
    </div>

    <script>
      (function () {
        const speedEl = document.getElementById("speed");
        const whoEl = document.getElementById("who");

        // GoalSpeed ships as km/h, not UU/s. The official Stats API doc
        // claims UU/s but its own example value (87.3) and observed values
        // match RL's in-game "x km/h" display directly — a goal RL shows
        // as 91 km/h arrives here as ~91. Treat it as km/h and round.
        // The same is true for BallLastTouch.speed.

        RLT.plugin.register({
          name: "last-goal-speed",
          version: "0.1.0",
          whilePhase: ["live", "replay"],

          events: {
            GoalScored(g) {
              speedEl.classList.remove("empty");
              speedEl.textContent = Math.round(g.goalSpeed || 0) + " km/h";
              whoEl.textContent = g.scorer.name;
            },
          },

          onLifecycle(phase) {
            if (phase === "idle") {
              speedEl.textContent = "—";
              speedEl.classList.add("empty");
              whoEl.textContent = "";
            }
          },
        });
      })();
    </script>
  </body>
</html>
