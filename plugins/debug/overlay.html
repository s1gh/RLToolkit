<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DebugPlugin</title>
    <link rel="stylesheet" href="/sdk.css" />
    <script src="/sdk.js" data-plugin="debug"></script>
    <style>
      body {
        font-family: var(--rlt-display);
        padding: 16px;
        color: var(--rlt-txt);
        background: var(--rlt-bg-0);
        margin: 0;
      }
      body.overlay-mode {
        background: transparent;
        padding: 0;
      }
      .card {
        background: var(--rlt-bg-1);
        border: 1px solid var(--rlt-line);
        border-radius: 12px;
        padding: 14px 18px;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
      }
      .header {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rlt-txt-3);
      }
      .panes {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        min-height: 0;
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--rlt-bg-0);
        border: 1px solid var(--rlt-line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .log {
        flex: 1;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.6;
      }
      .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid var(--rlt-line);
      }
      .log-entry .event-name {
        color: var(--rlt-cyan);
        font-weight: bold;
      }
      .log-entry .event-type {
        color: var(--rlt-txt-2);
        margin-left: 8px;
      }
      .log-entry .event-player {
        color: var(--rlt-txt-3);
        margin-left: 8px;
      }
      .log-entry .timestamp {
        color: var(--rlt-txt-3);
        font-size: 10px;
      }
      .counts {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--rlt-line);
        font-size: 11px;
        color: var(--rlt-txt-2);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
      }
      .counts span {
        color: var(--rlt-cyan);
      }
      /* Discoveries pane uses a table-ish layout (name / count / first / last). */
      .disc-list {
        flex: 1;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.5;
      }
      .disc-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid var(--rlt-line);
      }
      .disc-row .disc-name {
        color: var(--rlt-amber, #fbbf24);
        font-weight: bold;
        word-break: break-all;
      }
      .disc-row .disc-count {
        color: var(--rlt-cyan);
        text-align: right;
      }
      .disc-row .disc-times {
        grid-column: 1 / -1;
        color: var(--rlt-txt-3);
        font-size: 10px;
      }
      .disc-empty {
        color: var(--rlt-txt-3);
        font-size: 11px;
        font-style: italic;
        padding: 8px 0;
      }
      .focus-dot {
        position: absolute;
        top: 10px;
        right: 12px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--rlt-green, #4ade80);
        box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
        transition:
          background 120ms ease,
          box-shadow 120ms ease;
      }
      .focus-dot[data-focus="inactive"] {
        background: var(--rlt-txt-3, #555);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div
        class="focus-dot"
        id="focus-dot"
        data-focus="active"
        title="game focus"
      ></div>
      <div class="header">Debug</div>
      <div class="panes">
        <div class="pane">
          <div class="header">_StatfeedEvent Log</div>
          <div id="log" class="log"></div>
          <div id="counts" class="counts"></div>
        </div>
        <div class="pane">
          <div class="header">Unknown Statfeed Discoveries</div>
          <div id="disc-list" class="disc-list">
            <div class="disc-empty">No unknown statfeed names observed yet.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const logEl = document.getElementById("log");
        const countsEl = document.getElementById("counts");
        const discListEl = document.getElementById("disc-list");
        const seen = {};

        // Discoveries are keyed by eventName. Each entry tracks: count
        // (incremented locally when _UnknownStatfeed lands; seeded from
        // /api/statfeed-discoveries on load), firstSeen / lastSeen ISO
        // strings, lastTarget.
        const discoveries = {};

        function addEntry(s) {
          const name = s.eventName || "unknown";
          seen[name] = (seen[name] || 0) + 1;

          const entry = document.createElement("div");
          entry.className = "log-entry";

          const ts = new Date().toLocaleTimeString("en", {
            hour12: false,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });

          const player = s.mainTarget
            ? s.mainTarget.Name || s.mainTarget.name || ""
            : "";
          const secondary = s.secondaryTarget
            ? s.secondaryTarget.Name || s.secondaryTarget.name || ""
            : "";

          let detail = player;
          if (secondary) detail += " -> " + secondary;

          entry.innerHTML =
            '<span class="timestamp">' +
            ts +
            "</span> " +
            '<span class="event-name">' +
            name +
            "</span>" +
            (s.type ? '<span class="event-type">[' + s.type + "]</span>" : "") +
            (detail ? '<span class="event-player">' + detail + "</span>" : "");

          logEl.appendChild(entry);
          logEl.scrollTop = logEl.scrollHeight;

          renderCounts();
        }

        function renderCounts() {
          const entries = Object.entries(seen).sort((a, b) => b[1] - a[1]);
          countsEl.innerHTML = entries
            .map(([name, count]) => name + ": <span>" + count + "</span>")
            .join(" | ");
        }

        // ─── Discoveries panel ─────────────────────────────────────
        // Two data sources:
        //   1. /api/statfeed-discoveries — persisted snapshot, fetched on
        //      load so the panel shows what RL has emitted across past
        //      sessions, not just this run.
        //   2. live _UnknownStatfeed events — bumped into the in-memory
        //      map as they land so the count keeps moving without polling.
        // The persisted store flushes every 5s server-side, so reload-then-
        // reconnect plugins pick up live increments through the event path
        // before the next flush window.

        function fmtTime(iso) {
          if (!iso) return "—";
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return iso;
          return d.toLocaleString("en", {
            hour12: false,
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }

        function renderDiscoveries() {
          const entries = Object.values(discoveries).sort(
            (a, b) => b.count - a.count,
          );
          if (entries.length === 0) {
            discListEl.innerHTML =
              '<div class="disc-empty">No unknown statfeed names observed yet.</div>';
            return;
          }
          discListEl.innerHTML = entries
            .map(
              (d) =>
                '<div class="disc-row">' +
                '<span class="disc-name">' +
                d.name +
                "</span>" +
                '<span class="disc-count">×' +
                d.count +
                "</span>" +
                '<span class="disc-times">first: ' +
                fmtTime(d.firstSeen) +
                "  ·  last: " +
                fmtTime(d.lastSeen) +
                (d.lastTarget ? "  ·  by: " + d.lastTarget : "") +
                "</span>" +
                "</div>",
            )
            .join("");
        }

        function bumpDiscovery(name, target) {
          if (!name) return;
          const now = new Date().toISOString();
          const existing = discoveries[name];
          if (existing) {
            existing.count += 1;
            existing.lastSeen = now;
            if (target) existing.lastTarget = target;
          } else {
            discoveries[name] = {
              name,
              count: 1,
              firstSeen: now,
              lastSeen: now,
              lastTarget: target || null,
            };
          }
          renderDiscoveries();
        }

        async function loadDiscoveries() {
          try {
            const res = await fetch("/api/statfeed-discoveries");
            if (!res.ok) return;
            const list = await res.json();
            if (!Array.isArray(list)) return;
            for (const d of list) {
              // Server uses Name/Count/FirstSeen/LastSeen (Go struct
              // defaults). Be permissive for either casing.
              const name = d.Name || d.name;
              if (!name) continue;
              const count = d.Count ?? d.count ?? 0;
              const firstSeen = d.FirstSeen || d.firstSeen || null;
              const lastSeen = d.LastSeen || d.lastSeen || null;
              // If a live event already bumped this name this session,
              // keep the higher count rather than clobbering it with the
              // last-flushed disk value (which may lag).
              const existing = discoveries[name];
              if (existing && existing.count >= count) {
                existing.firstSeen = existing.firstSeen || firstSeen;
                continue;
              }
              discoveries[name] = {
                name,
                count,
                firstSeen,
                lastSeen,
                lastTarget: existing ? existing.lastTarget : null,
              };
            }
            renderDiscoveries();
          } catch (_) {
            /* offline / endpoint missing — ignore, live events still work */
          }
        }

        loadDiscoveries();

        RLT.plugin.register({
          whilePhase: ["live", "replay", "countdown", "paused"],

          events: {
            _StatfeedEvent(s) {
              addEntry(s);
            },
            _UnknownStatfeed(payload) {
              const name = payload?.eventName;
              const target = payload?.mainTarget
                ? payload.mainTarget.name || payload.mainTarget.Name || null
                : null;
              bumpDiscovery(name, target);
            },
          },

          onFocusChange(active) {
            const dot = document.getElementById("focus-dot");
            if (dot) dot.dataset.focus = active ? "active" : "inactive";
          },
        });
      })();
    </script>
  </body>
</html>
