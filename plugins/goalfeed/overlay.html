<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goal Feed</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="/sdk.css" rel="stylesheet">
<script src="/sdk.js" data-plugin="goalfeed"></script>
<style>
  :root {
    --bg-0:#0a0c14; --bg-1:#0f1320; --bg-2:#161b2c;
    --line:#232a44;
    --txt:#e6e9f5; --txt-2:#a9b0cf; --txt-3:#6c739a;
    --blue:#3b82f6; --orange:#fb7c3c;
    --gold:#fbbf24;
    --display:'Saira Condensed',system-ui,sans-serif;
    --ui:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--ui); font-size:13px; color:var(--txt);
    background:var(--bg-0); min-height:100vh; padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  /* In overlay mode the manifest's offset_x/offset_y supplies any spacing —
     the body itself must be flush so anchor: bottom-right offset 0,0 really
     means flush bottom-right. */
  body.overlay-mode{ background:transparent; overflow:hidden; padding:0; }

  .card{
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  body.overlay-mode .card{
    background:linear-gradient(180deg,rgba(15,19,32,.92),rgba(22,27,44,.92));
    width:100%;
    height:100%;
  }

  h2{
    font-family:var(--display); font-size:14px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.18em;
    color:#fff; margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  h2 .count{
    font-family:var(--mono); font-size:10px; color:var(--txt-3);
    font-weight:500; letter-spacing:0.1em;
  }

  .feed{ display:flex; flex-direction:column; gap:6px; }
  .empty{
    text-align:center; padding:18px 0;
    font-family:var(--display); font-size:11px;
    color:var(--txt-3); text-transform:uppercase; letter-spacing:0.16em;
    font-weight:600;
  }

  .row{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px;
    padding:8px 10px;
    background:var(--bg-0); border:1px solid var(--line);
    border-radius:8px;
    align-items:center;
    animation:slideIn .3s ease-out;
  }
  .row.blue   { border-left:3px solid var(--blue);   }
  .row.orange { border-left:3px solid var(--orange); }
  .row.is-me  { box-shadow:0 0 12px rgba(251,191,36,.25); }

  @keyframes slideIn {
    from { opacity:0; transform:translateX(-6px); }
    to   { opacity:1; transform:translateX(0); }
  }

  .badge{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:13px;
    color:#fff;
  }
  .badge.blue   { background:var(--blue);   }
  .badge.orange { background:var(--orange); }

  .info{ min-width:0; }
  .scorer{
    font-family:var(--display); font-weight:600; font-size:14px;
    color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .scorer .you{
    display:inline-block; margin-left:6px;
    font-family:var(--ui); font-size:9px; font-weight:800;
    color:var(--gold); letter-spacing:0.14em;
  }
  .assist{
    font-family:var(--mono); font-size:10px; color:var(--txt-3);
    margin-top:1px;
  }

  .speed{
    font-family:var(--display); font-feature-settings:'tnum';
    font-size:14px; font-weight:700; color:var(--gold);
    text-align:right;
  }
  .speed .unit{
    font-size:9px; color:var(--txt-3); font-weight:500;
    letter-spacing:0.1em; margin-left:2px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Goal Feed <span class="count" id="count">0</span></h2>
  <div class="feed" id="feed">
    <div class="empty">no goals yet</div>
  </div>
</div>

<script>
'use strict';
(function () {
  const isOverlay = new URLSearchParams(location.search).has('overlay');
  if (isOverlay) document.body.classList.add('overlay-mode');

  const goals = []; // { scorer, assister, team, speed, isMe, time }
  const MAX = 6;

  function uuToKph(uu) {
    // RL's Unreal Units → real-world kph: ball speed of 6000 UU/s ≈ 200 kph.
    return Math.round(uu * 0.0364);
  }

  function render() {
    const feed = document.getElementById('feed');
    const count = document.getElementById('count');
    count.textContent = goals.length;
    if (goals.length === 0) {
      feed.innerHTML = '<div class="empty">no goals yet</div>';
      return;
    }
    feed.innerHTML = goals.map((g) => {
      const teamCls = g.team === 0 ? 'blue' : 'orange';
      const initial = (g.scorer || '?').charAt(0).toUpperCase();
      const youTag = g.isMe ? '<span class="you">YOU</span>' : '';
      const assist = g.assister
        ? '<div class="assist">assist · ' + RLT.ui.esc(g.assister) + '</div>'
        : '';
      return '<div class="row ' + teamCls + (g.isMe ? ' is-me' : '') + '">' +
        '<div class="badge ' + teamCls + '">' + RLT.ui.esc(initial) + '</div>' +
        '<div class="info">' +
          '<div class="scorer">' + RLT.ui.esc(g.scorer) + youTag + '</div>' +
          assist +
        '</div>' +
        '<div class="speed">' + g.speedKph + '<span class="unit">KPH</span></div>' +
      '</div>';
    }).join('');
  }

  RLT.plugin.register({
    name:    'goalfeed',
    version: '1.0.0',
    author:  'rl-toolkit',

    // Only record goals during actual gameplay or replays — not from menu/idle.
    whilePhase: ['live', 'replay'],

    events: {
      GoalScored(g) {
        goals.unshift({
          scorer:   g.scorer.player ? g.scorer.player.name : g.scorer.name,
          assister: g.assister ? (g.assister.player ? g.assister.player.name : g.assister.name) : null,
          team:     g.scorer.team,
          isMe:     g.scorer.isMe,
          speedKph: uuToKph(g.goalSpeed || 0),
          time:     Date.now(),
        });
        if (goals.length > MAX) goals.length = MAX;
        render();
      },
    },

    // Clear the feed when leaving a match.
    onLifecycle(phase, prev) {
      if (phase === 'idle' && goals.length) {
        goals.length = 0;
        render();
      }
    },

    init: render,
  });
})();
</script>

</body>
</html>
