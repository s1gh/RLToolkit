<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Déjà Vu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="/sdk.css" rel="stylesheet" />
    <link href="/plugins/dejavu/styles.css" rel="stylesheet" />
    <script src="/sdk.js" data-plugin="dejavu"></script>
  </head>
  <body>
    <!-- ═════════════════════ CONTROL PAGE ═════════════════════ -->
    <main class="page" id="page">
      <header class="topbar">
        <div class="brand">
          <div class="logo">DV</div>
          <div>
            <h1>Déjà Vu</h1>
            <div class="tag">Have we played before?</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="conn-pill" id="conn" data-status="disconnected"
            >offline</span
          >
          <button
            class="icon-btn"
            id="open-overlay"
            title="Open overlay"
            onclick="window.open('?overlay=1', '_blank')"
          >
            ⧉
          </button>
        </div>
      </header>

      <!-- Identity (collapsed by default; expands on pencil click or when unclaimed) -->
      <section class="identity-strip" id="id-strip" data-mode="collapsed">
        <div class="il-collapsed">
          <span class="il-label">you:</span>
          <span class="il-name" id="id-val">unclaimed</span>
          <button class="il-edit" id="id-edit" title="Change identity">
            ✎
          </button>
          <span class="il-hint" id="id-hint" hidden
            >— click "this is me" on your row when you're in a match</span
          >
        </div>
        <div class="il-expanded" id="id-panel" hidden>
          <input
            class="input"
            type="text"
            id="id-input"
            placeholder="Steam|76561...|0"
          />
          <button class="btn" id="id-set">Set</button>
          <button class="btn ghost" id="id-clear">Clear</button>
          <button class="btn ghost" id="id-cancel">Cancel</button>
        </div>
      </section>

      <!-- Two-column grid: live match (left) | most-met leaderboard (right) -->
      <div class="grid">
        <section class="card col-match">
          <div class="card-head">
            <h2>This match</h2>
            <span class="badge" id="match-badge">offline</span>
          </div>
          <div id="match-host">
            <div class="card-empty">
              <div class="em-icon">◇</div>
              queue up — waiting for a match
            </div>
          </div>
        </section>

        <section class="card col-leader">
          <div class="card-head">
            <h2>Most met</h2>
            <span class="badge mono"><span id="lb-count">0</span> shown</span>
          </div>
          <div id="lb-host"></div>
        </section>
      </div>
    </main>

    <!-- ═════════════════════ OVERLAY ═════════════════════ -->
    <div class="ov" id="ov">
      <div class="ov-card" id="ov-card">
        <div id="ov-body">
          <div class="ov-empty">offline</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Plugin modules. Order matters: lib → views → app.
         lib/* are leaf utilities (no SDK calls); views/* read from RLT
         and render; app.js wires SDK callbacks → views. -->
    <script src="/plugins/dejavu/lib/dom.js"></script>
    <script src="/plugins/dejavu/lib/constants.js"></script>
    <script src="/plugins/dejavu/lib/returners.js"></script>
    <script src="/plugins/dejavu/views/identity.js"></script>
    <script src="/plugins/dejavu/views/match.js"></script>
    <script src="/plugins/dejavu/views/leaderboard.js"></script>
    <script src="/plugins/dejavu/views/overlay.js"></script>
    <script src="/plugins/dejavu/app.js"></script>
  </body>
</html>
