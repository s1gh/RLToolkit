<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demolitions 2</title>
    <link href="/sdk.css" rel="stylesheet" />
    <link href="/plugins/demos2/styles.css" rel="stylesheet" />
    <script src="/sdk.js" data-plugin="demos2" data-view="overlay"></script>
  </head>
  <body>
    <div class="ov" id="ov" data-mode="idle" data-tier="tier-base">
      <div class="ov-main">
        <div class="ov-col-left">
          <div class="ov-head">
            <span class="ov-label">Demos</span>
            <span class="ov-total" id="ov-total">0</span>
          </div>
          <div class="ov-best" id="ov-best" hidden data-tier="tier-base">
            <span class="ov-best-label">BEST</span>
            <span class="ov-best-streak" id="ov-best-streak">x0</span>
            <span class="ov-best-word" id="ov-best-word"></span>
          </div>
          <div class="ov-last" id="ov-last" hidden>
            <span class="ov-last-label">LAST</span>
            <span class="ov-last-name" id="ov-last-name"></span>
          </div>
        </div>
        <div class="ov-stack">
          <div class="ov-bar" id="ov-bar"><div class="ov-bar-fill" id="ov-bar-fill"></div></div>
          <div class="ov-active">
            <div class="ov-streak" id="ov-streak">x0</div>
            <div class="ov-word" id="ov-word"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="/plugins/demos2/app.js"></script>
  </body>
</html>
