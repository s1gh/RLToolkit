<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demolitions</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/sdk.css" />
    <script src="/sdk.js" data-plugin="demos"></script>

    <!--
      ─────────────────────────────────────────────────────────────────────
      DEMOLITIONS — a reference plugin for new authors.

      Goal: be the simplest plugin that does something useful, so a developer
      can read this single file top to bottom and understand the SDK shape.
      Everything (HTML, CSS, JS) lives here on purpose — compare with the
      `dejavu` plugin to see how a larger plugin splits things up.

      What it does:
        • Counts demolitions YOU dealt to other players, by victim
        • Persists the all-time totals via the SDK's per-plugin store
        • Shows the live tally in two places:
            - in-game overlay  (?overlay=1, transparent, click-through)
            - control page     (the dashboard tab — match + all-time list)
      ─────────────────────────────────────────────────────────────────────
    -->
    <style>
      /* ──────────────────────────────────────────────────────────────────
         All colors, fonts, and radii come from sdk.css custom properties
         (--rlt-*). That's the toolkit's design language — use those tokens
         and your plugin will look like part of the dashboard. Demolitions
         are violent, so we lean on --rlt-orange as the accent.
         ────────────────────────────────────────────────────────────────── */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--rlt-ui);
        font-size: 13px;
        color: var(--rlt-txt);
        background:
          radial-gradient(900px 500px at 85% -10%, rgba(251, 124, 60, 0.1), transparent 60%),
          radial-gradient(800px 400px at 0% 110%, rgba(244, 114, 182, 0.06), transparent 60%),
          var(--rlt-bg-0);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      body.overlay-mode {
        background: transparent;
        overflow: hidden;
      }

      /* ════════════════════════════════════════════════════════
         CONTROL PAGE  (dashboard tab)
         ════════════════════════════════════════════════════════ */
      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }

      /* Topbar — same card-on-card treatment dejavu uses, so the dashboard
         tab reads as one toolkit even when you switch between plugins. */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 14px 18px;
        background: linear-gradient(135deg, var(--rlt-bg-1), var(--rlt-bg-2));
        border: 1px solid var(--rlt-line);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--rlt-orange), var(--rlt-magenta));
        box-shadow: 0 0 24px var(--rlt-orange-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--rlt-display);
        font-weight: 700;
        font-size: 18px;
        color: var(--rlt-bg-0);
        letter-spacing: -0.02em;
      }
      h1 {
        font-family: var(--rlt-display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff 30%, var(--rlt-orange));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tag {
        font-size: 11px;
        color: var(--rlt-txt-3);
        letter-spacing: 0.02em;
        font-weight: 500;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Connection pill — mirrors dejavu's so a player running both
         plugins gets one consistent live/offline status indicator. */
      .conn-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--rlt-bg-3);
        border: 1px solid var(--rlt-line);
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
        color: var(--rlt-txt-2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .conn-pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--rlt-txt-3);
      }
      .conn-pill[data-status="connected"]::before {
        background: var(--rlt-green);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
        animation: pulse 1.4s ease-in-out infinite alternate;
      }
      .conn-pill[data-status="disconnected"]::before {
        background: #ef4444;
      }
      @keyframes pulse {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--rlt-bg-3);
        border: 1px solid var(--rlt-line);
        color: var(--rlt-txt-2);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        transition: all 0.15s ease;
      }
      .icon-btn:hover {
        border-color: var(--rlt-orange);
        color: var(--rlt-orange);
        box-shadow: 0 0 16px var(--rlt-orange-glow);
      }

      /* Identity strip — read-only here. Demos doesn't claim identity;
         that's dejavu's job. We show the current claim (or a hint to go
         claim one) so the player knows why their demos aren't counting. */
      .identity-strip {
        background: var(--rlt-bg-1);
        border: 1px solid var(--rlt-line);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 4px;
        font-size: 13px;
        color: var(--rlt-txt-2);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .il-label {
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.16em;
        font-weight: 700;
        color: var(--rlt-txt-3);
      }
      .il-name {
        font-family: var(--rlt-display);
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.01em;
      }
      .il-name.empty {
        color: var(--rlt-txt-3);
        font-style: italic;
        font-weight: 500;
      }
      .il-hint {
        font-style: italic;
        color: var(--rlt-txt-3);
        font-size: 12px;
      }

      /* Two-column grid: this match (left) + all time (right). Same shape
         and breakpoint as dejavu's grid so the dashboard tabs feel like
         one app rather than two. */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 20px;
        margin-top: 20px;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: linear-gradient(180deg, var(--rlt-bg-1), var(--rlt-bg-2));
        border: 1px solid var(--rlt-line);
        border-radius: var(--rlt-radius-lg);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        padding: 20px 22px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--rlt-line);
      }
      .card-head h2 {
        font-family: var(--rlt-display);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
      }
      .badge {
        font-family: var(--rlt-mono);
        font-size: 10px;
        font-weight: 700;
        color: var(--rlt-txt-2);
        background: var(--rlt-bg-3);
        border: 1px solid var(--rlt-line);
        border-radius: 99px;
        padding: 4px 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Victim row — flush list, separator above each row except first.
         Mirrors dejavu's leaderboard rhythm: list reads as one composed
         column rather than a wall of mini-cards. */
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        transition: background 0.12s ease;
      }
      .row + .row {
        border-top: 1px solid var(--rlt-line);
      }
      .row-name {
        font-family: var(--rlt-ui);
        font-size: 13px;
        font-weight: 500;
        color: var(--rlt-txt);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-count {
        font-family: var(--rlt-display);
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        color: var(--rlt-orange);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }
      .row-count .x {
        font-family: var(--rlt-mono);
        font-size: 10px;
        font-weight: 500;
        color: var(--rlt-txt-3);
        margin-right: 2px;
      }

      /* Empty state — same em-icon pattern dejavu uses. */
      .card-empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--rlt-txt-3);
        font-size: 12px;
      }
      .card-empty .em-icon {
        font-size: 28px;
        margin-bottom: 6px;
        opacity: 0.5;
        font-family: var(--rlt-display);
        line-height: 1;
      }

      /* ════════════════════════════════════════════════════════
         OVERLAY MODE  (?overlay=1) — "Kill feed" HUD
         ════════════════════════════════════════════════════════
         Design intent: a HUD readout, not a webpage.
         - No outer card: each row carries its own translucent backing
           so the game shows through between rows.
         - Header tag mirrors the team labels in dejavu's overlay so a
           player running both plugins sees one consistent HUD language.
         - rem-based sizing rooted at <html>; bump body font-size to
           rescale the whole widget in one place.
         ════════════════════════════════════════════════════════ */
      body.overlay-mode {
        font-size: 16px;
      }
      .ov {
        display: inline-flex;
        flex-direction: column;
        gap: 0.22rem;
        width: max-content;
        max-width: 100%;
        padding: 0.25rem 1rem 1rem 0;
        animation: ov-fade-in 320ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* In active/break mode the widget needs the full iframe width so
         the victim chip has room to grow before it ellipsis-truncates.
         Idle mode keeps `width: max-content` so the small header chip
         hugs its content (looks weird floated as a wide bar). */
      .ov[data-mode="active"],
      .ov[data-mode="break"] {
        width: 100%;
        padding: 0;
      }

      /* Header tag — same backing/border-left treatment as dejavu's team
         labels. Orange because that's the demos accent. */
      .ov-head {
        display: inline-flex;
        align-items: baseline;
        gap: 0.6rem;
        align-self: flex-start;
        padding: 0.18rem 0.6rem 0.18rem 0.5rem;
        background: rgba(10, 12, 20, 0.55);
        border-left: 2px solid var(--rlt-orange);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        margin-bottom: 0.12rem;
      }
      .ov-label {
        font-family: var(--rlt-display);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--rlt-orange);
      }
      .ov-total {
        font-family: var(--rlt-display);
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .ov-list {
        display: flex;
        flex-direction: column;
        gap: 0.18rem;
      }
      .ov-row {
        display: grid;
        grid-template-columns: 1.6rem 1fr;
        gap: 0.5rem;
        align-items: center;
        padding: 0.3rem 0.6rem 0.3rem 0.5rem;
        background: rgba(10, 12, 20, 0.62);
        border-left: 2px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px) saturate(130%);
        -webkit-backdrop-filter: blur(10px) saturate(130%);
        border-radius: 2px;
        animation: ov-row-in 280ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: calc(var(--ov-i, 0) * 40ms);
      }
      .ov-row .c {
        font-family: var(--rlt-display);
        font-feature-settings: "tnum";
        font-size: 1rem;
        font-weight: 700;
        color: var(--rlt-orange);
        text-align: right;
        letter-spacing: 0.04em;
        text-shadow: 0 0 8px rgba(251, 124, 60, 0.45);
      }
      .ov-row .n {
        font-family: var(--rlt-display);
        font-size: 0.92rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      }

      /* Empty overlay — barely-there caption, no card backing. */
      .ov-empty {
        align-self: flex-start;
        font-family: var(--rlt-display);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(169, 176, 207, 0.55);
        padding: 0.25rem 0.55rem;
        background: rgba(10, 12, 20, 0.45);
        border-left: 2px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }

      @keyframes ov-fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes ov-row-in {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* ─── Mode toggle ───────────────────────────────────────────
         Both subtrees live in the DOM; data-mode on the root chooses
         which is visible. Crossfade for the break→idle transition. */
      .ov-idle,
      .ov-active {
        transition: opacity 200ms ease;
      }
      .ov[data-mode="idle"] .ov-active {
        opacity: 0;
        pointer-events: none;
        position: absolute;
      }
      .ov[data-mode="active"] .ov-idle,
      .ov[data-mode="break"] .ov-idle {
        opacity: 0;
        pointer-events: none;
        position: absolute;
      }
      /* Active layout fills the widget; idle uses inline-flex from .ov.
         No background, no border, no border-radius — the rectangle of
         this element must stay invisible. Tier "heat" is painted via
         filter: drop-shadow() on the inner content (text + chip) so the
         glow follows the letterforms, not the bounding box. */
      .ov-active {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.1rem;
        padding: 0.5rem 0.7rem 0.8rem;
      }
      .ov-idle {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.22rem;
      }

      /* ─── BEST badge (idle) ─────────────────────────────────────
         Color is the tier color of the streak it represents — set via
         tier classes on .ov. Tag style mirrors the dejavu team labels. */
      .ov-best {
        align-self: flex-start;
        display: inline-flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.22rem 0.6rem 0.22rem 0.55rem;
        background: rgba(10, 12, 20, 0.65);
        border-left: 2px solid var(--rlt-orange);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      }
      /* The author rule above sets `display: inline-flex`, which beats
         the UA stylesheet's `[hidden] { display: none }` by source order
         at equal specificity. Restore the hidden behaviour explicitly so
         JS toggling `el.hidden` works as expected. */
      .ov-best[hidden] {
        display: none;
      }
      /* The BEST label is intentionally neutral (cream-toned, not tier-
         colored) so it reads as "this is what comes next is a record",
         not as part of the tier word that follows it. The streak number
         and tier word carry the heat. */
      .ov-best-label {
        font-family: var(--rlt-display);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--rlt-txt);
        opacity: 0.7;
      }
      .ov-best-streak {
        font-family: var(--rlt-display);
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--rlt-orange);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .ov-best-word {
        font-family: var(--rlt-display);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--rlt-orange);
      }

      /* ─── Active: timer bar ─────────────────────────────────────
         CSS-driven drain: width transitions from 100% → 0% over the
         combo window. JS resets to 100% on every demo by toggling a
         class to interrupt the transition (see Task 6). */
      .ov-bar {
        width: 60%;
        max-width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 0.35rem;
      }
      .ov-bar-fill {
        width: 0%;
        height: 100%;
        background: var(--rlt-orange);
        transition: width 20000ms linear;
        box-shadow: 0 0 6px rgba(251, 124, 60, 0.6);
      }
      /* Reset class — instantly snaps to 100% with no transition.
         JS removes it on the next frame so the drain transition takes
         over and runs to 0% over COMBO_WINDOW_MS. */
      .ov-bar-fill.reset {
        /* biome-ignore lint/complexity/noImportantStyles: deliberate transition interrupt */
        width: 100% !important;
        /* biome-ignore lint/complexity/noImportantStyles: deliberate transition interrupt */
        transition: none !important;
      }

      /* ─── Active: number + word ─────────────────────────────────
         Sizing is base here; tier classes in Task 6 scale up. */
      .ov-streak {
        font-family: var(--rlt-display);
        font-feature-settings: "tnum";
        font-size: 2.6rem;
        font-weight: 700;
        line-height: 1;
        color: var(--rlt-orange);
        letter-spacing: -0.02em;
        text-shadow: 0 0 14px rgba(251, 124, 60, 0.5);
        transition: font-size 220ms ease, color 220ms ease;
      }
      .ov-word {
        font-family: var(--rlt-display);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rlt-orange);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        transition: font-size 220ms ease, color 220ms ease;
      }
      /* Victim line — its own backing chip so the name reads against any
         game background (chain-link fences, dirt, sky, etc). Cream text
         on a translucent dark pill; same backdrop-blur trick as the
         BEST badge and dejavu's row chrome. The arrow glyph is part of
         the textContent so it inherits the same color. */
      .ov-victim {
        font-family: var(--rlt-display);
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--rlt-txt);
        margin-top: 0.45rem;
        padding: 0.2rem 0.65rem;
        background: rgba(10, 12, 20, 0.7);
        border-left: 2px solid var(--rlt-orange);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        letter-spacing: 0.02em;
      }
      /* Tier-tinted left border on the victim chip — subtle visual tie
         to the streak's heat without recoloring the name itself (the
         cream text stays readable against any background). */
      .ov.tier-hot .ov-victim         { border-left-color: #ff6a1f; }
      .ov.tier-bloom .ov-victim       { border-left-color: #ff4d8a; }
      .ov.tier-apocalypse .ov-victim  { border-left-color: #ff2d62; }
      /* Empty-victim case — keep the chip from rendering as an orphan
         border-left when there's no name yet (first demo of a streak). */
      .ov-victim:empty {
        display: none;
      }

      /* Break state — desaturate, replace subtitle styling */
      .ov[data-mode="break"] .ov-streak,
      .ov[data-mode="break"] .ov-word {
        filter: saturate(0.4) brightness(0.7);
      }
      .ov[data-mode="break"] .ov-victim {
        font-family: var(--rlt-display);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--rlt-txt-2);
        font-size: 0.7rem;
      }

      /* When idle, hide the active subtree's reserved layout space too */
      .ov[data-mode="idle"] .ov-active {
        height: 0;
        overflow: hidden;
        padding: 0;
      }

      /* ─── Tier escalation ───────────────────────────────────────
         Each tier class on .ov drives color/size for the active
         subtree and rim-bloom on the .ov itself. Sizes are relative
         to the base set in Task 5 (.ov-streak 2.6rem, .ov-word 1rem). */

      /* tier-base (x2 TAGGED) — base orange, no escalation */
      .ov.tier-base .ov-streak,
      .ov.tier-base .ov-word {
        color: var(--rlt-orange);
      }

      /* tier-glow (x3 SMOKED) — orange + extra glow + steady rim */
      .ov.tier-glow .ov-streak {
        color: var(--rlt-orange);
        text-shadow: 0 0 20px rgba(251, 124, 60, 0.7);
      }
      .ov.tier-glow .ov-word {
        color: var(--rlt-orange);
        text-shadow: 0 0 12px rgba(251, 124, 60, 0.6), 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .ov.tier-glow[data-mode="active"] .ov-active {
        filter: drop-shadow(0 0 12px rgba(251, 124, 60, 0.45));
      }

      /* tier-hot (x4 ANNIHILATED) — hotter orange, +15% size,
         steady rim + shake-on-demo class */
      .ov.tier-hot .ov-streak {
        font-size: 3rem;
        color: #ff6a1f;
        text-shadow: 0 0 24px rgba(255, 106, 31, 0.8);
      }
      .ov.tier-hot .ov-word {
        font-size: 1.15rem;
        color: #ff6a1f;
        text-shadow: 0 0 14px rgba(255, 106, 31, 0.7), 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .ov.tier-hot[data-mode="active"] .ov-active {
        filter: drop-shadow(0 0 16px rgba(255, 106, 31, 0.65));
      }

      /* tier-bloom (x5 OBLITERATED) — magenta-orange, +30% size,
         hard rim-bloom */
      .ov.tier-bloom .ov-streak {
        font-size: 3.4rem;
        color: #ff4d8a;
        text-shadow:
          0 0 28px rgba(255, 77, 138, 0.9),
          0 0 12px rgba(255, 106, 31, 0.6);
      }
      .ov.tier-bloom .ov-word {
        font-size: 1.3rem;
        color: #ff4d8a;
        text-shadow: 0 0 16px rgba(255, 77, 138, 0.8), 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .ov.tier-bloom[data-mode="active"] .ov-active {
        filter: drop-shadow(0 0 22px rgba(255, 77, 138, 0.8));
      }

      /* tier-apocalypse (x6+) — red-magenta, +45% size,
         pulsing rim-bloom that keeps energy alive between demos */
      .ov.tier-apocalypse .ov-streak {
        font-size: 3.8rem;
        color: #ff2d62;
        text-shadow:
          0 0 32px rgba(255, 45, 98, 1),
          0 0 14px rgba(244, 114, 182, 0.7);
      }
      .ov.tier-apocalypse .ov-word {
        font-size: 1.45rem;
        color: #ff2d62;
        letter-spacing: 0.24em;
        text-shadow: 0 0 18px rgba(255, 45, 98, 0.95), 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .ov.tier-apocalypse[data-mode="active"] .ov-active {
        animation: ov-apocalypse-pulse 1.6s ease-in-out infinite;
      }
      @keyframes ov-apocalypse-pulse {
        0%, 100% { filter: drop-shadow(0 0 22px rgba(255, 45, 98, 0.85)); }
        50%      { filter: drop-shadow(0 0 32px rgba(255, 45, 98, 1)); }
      }

      /* BEST badge picks up the tier color it was earned at */
      .ov.tier-hot .ov-best,
      .ov.tier-bloom .ov-best,
      .ov.tier-apocalypse .ov-best {
        border-left-color: currentColor;
      }
      .ov.tier-hot .ov-best-streak,
      .ov.tier-hot .ov-best-word { color: #ff6a1f; }
      .ov.tier-bloom .ov-best-streak,
      .ov.tier-bloom .ov-best-word { color: #ff4d8a; }
      .ov.tier-apocalypse .ov-best-streak,
      .ov.tier-apocalypse .ov-best-word { color: #ff2d62; }

      /* ─── Shake on demo ────────────────────────────────────────
         JS adds .shake-light / .shake-hard on every demo at tier-hot+;
         self-removed on animationend. Translate-only so it doesn't
         compound with the apocalypse rim-pulse box-shadow. */
      @keyframes ov-shake-light {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 1px); }
        50% { transform: translate(2px, -1px); }
        75% { transform: translate(-1px, 2px); }
      }
      @keyframes ov-shake-hard {
        0%, 100% { transform: translate(0, 0); }
        15% { transform: translate(-4px, 2px); }
        30% { transform: translate(4px, -3px); }
        45% { transform: translate(-3px, -2px); }
        60% { transform: translate(3px, 3px); }
        80% { transform: translate(-2px, 1px); }
      }
      /* Shake animates the whole widget (.ov), so it lives at the iframe
         level. Apocalypse pulse animates only the inner .ov-active subtree
         (so its glow doesn't bleed into the iframe edge), so the two
         animations target different elements and don't fight. */
      .ov.shake-light { animation: ov-shake-light 120ms ease-out; }
      .ov.shake-hard  { animation: ov-shake-hard 160ms ease-out; }

      /* Honor reduced-motion — keep the static look. */
      @media (prefers-reduced-motion: reduce) {
        body.overlay-mode .ov,
        .ov-row {
          /* biome-ignore lint/complexity/noImportantStyles: must beat animation declarations */
          animation: none !important;
        }
      }

      /* ?overlay=1 hides the control page, no-overlay hides the widget.
         The SDK adds .overlay-mode to <body> when the URL has ?overlay=1.
         Placed last so the high-specificity selectors below win against
         the base .page / .ov rules above (descending-specificity rule). */
      body.overlay-mode .page {
        display: none;
      }
      body:not(.overlay-mode) .ov {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- ═════════════════════ CONTROL PAGE ═════════════════════ -->
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <div class="logo">DM</div>
          <div>
            <h1>Demolitions</h1>
            <div class="tag">Who you've sent flying</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="conn-pill" id="conn" data-status="disconnected"
            >offline</span
          >
          <button
            type="button"
            class="icon-btn"
            id="open-overlay"
            title="Open overlay"
            onclick="window.open('?overlay=1', '_blank')"
          >
            ⧉
          </button>
        </div>
      </header>

      <!-- Identity strip — read-only. Demos doesn't own identity (dejavu
           does), so we just show what's claimed and nudge the user toward
           dejavu when nothing is. -->
      <section class="identity-strip">
        <span class="il-label">you:</span>
        <span class="il-name empty" id="id-val">unclaimed</span>
        <span class="il-hint" id="id-hint"
          >— claim your identity in Déjà Vu so your demos count</span
        >
      </section>

      <!-- Two-column grid: live match (left) | all-time leaderboard (right) -->
      <div class="grid">
        <section class="card">
          <div class="card-head">
            <h2>This match</h2>
            <span class="badge" id="match-badge">no match</span>
          </div>
          <div id="match-list"></div>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>All time</h2>
            <span class="badge"
              ><span id="total">0</span> demos ·
              <span id="all-count">0</span> rivals</span
            >
          </div>
          <div id="all-list"></div>
        </section>
      </div>
    </main>

    <!-- ═════════════════════ OVERLAY ═════════════════════
         The widget has two rendered modes that share the same root:
         - data-mode="idle"   shows .ov-idle (header + BEST badge + victims)
         - data-mode="active" shows .ov-active (timer bar + big number/word)
         - data-mode="break"  reuses .ov-active with .is-break for styling

         Tier classes (.tier-base, .tier-glow, .tier-hot, .tier-bloom,
         .tier-apocalypse) are also applied to .ov so every descendant
         picks up the right color/size/effect from one source.
    -->
    <div class="ov" id="ov" data-mode="idle">
      <!-- IDLE layout -->
      <div class="ov-idle">
        <div class="ov-head">
          <span class="ov-label">Demos</span>
          <span class="ov-total" id="ov-total">0</span>
        </div>
        <div class="ov-best" id="ov-best" hidden>
          <span class="ov-best-label">BEST</span>
          <span class="ov-best-streak" id="ov-best-streak">x0</span>
          <span class="ov-best-word" id="ov-best-word"></span>
        </div>
        <div id="ov-list" class="ov-list"></div>
      </div>

      <!-- ACTIVE / BREAK layout -->
      <div class="ov-active">
        <div class="ov-bar"><div class="ov-bar-fill" id="ov-bar-fill"></div></div>
        <div class="ov-streak" id="ov-streak">x0</div>
        <div class="ov-word" id="ov-word">TAGGED</div>
        <div class="ov-victim" id="ov-victim">↳ —</div>
      </div>
    </div>

    <script>
      // ═══════════════════════════════════════════════════════════════════
      // PLUGIN CODE
      //
      // Loaded as a classic <script>, not an ES module. The SDK exposes
      // itself as the global `RLT`. Single closure to keep our locals off
      // the global scope.
      // ═══════════════════════════════════════════════════════════════════
      (function () {
        'use strict';

        const $ = (id) => document.getElementById(id);
        const isOverlay = new URLSearchParams(location.search).has('overlay');

        // ─── Combo tiers ────────────────────────────────────────────
        // Streak counts map to a tier (word + visual class). The class
        // names below match CSS rules added later in this file. x6+ is
        // the cap — APOCALYPSE; the streak number keeps climbing past 6
        // but the word and styling stop there.
        const COMBO_WINDOW_MS = 20000; // gap allowed between demos
        const BREAK_HOLD_MS = 1000;    // freeze duration on streak end
        const BREAK_FADE_MS = 200;     // crossfade from break to idle

        const TIERS = [
          { min: 2, word: 'TAGGED',      cls: 'tier-base' },
          { min: 3, word: 'SMOKED',      cls: 'tier-glow' },
          { min: 4, word: 'ANNIHILATED', cls: 'tier-hot' },
          { min: 5, word: 'OBLITERATED', cls: 'tier-bloom' },
          { min: 6, word: 'APOCALYPSE',  cls: 'tier-apocalypse' },
        ];

        // tierFor(streak) returns the highest tier whose `min` is <= streak,
        // or null when streak < 2 (no tier — combo just started).
        function tierFor(streak) {
          let hit = null;
          for (const t of TIERS) {
            if (streak >= t.min) hit = t;
          }
          return hit;
        }

        // computeUiState(now) — derive the renderable UI state from the
        // raw combo state. Pure read, no side effects, safe to call from
        // any render path.
        //
        // `mode` rules:
        //   idle    — no demo yet, or now - lastDemoAt > window + hold
        //   active  — now - lastDemoAt <= COMBO_WINDOW_MS
        //   break   — window expired, hold still in effect, streak >= 1
        //
        // The break window only applies when there was an actual streak
        // to mourn (currentStreak >= 1). A demo at lastDemoAt = 0 (never
        // demoed) goes straight to idle.
        function computeUiState(now) {
          const sinceDemo = now - lastDemoAt;
          let mode;
          if (!lastDemoAt) {
            mode = 'idle';
          } else if (sinceDemo <= COMBO_WINDOW_MS) {
            mode = 'active';
          } else if (currentStreak >= 1 && sinceDemo <= COMBO_WINDOW_MS + BREAK_HOLD_MS) {
            mode = 'break';
          } else {
            mode = 'idle';
          }

          const t = tierFor(currentStreak);
          return {
            mode,
            streak: currentStreak,
            word: t ? t.word : '',
            tierClass: t ? t.cls : 'tier-base',
            victim: lastVictimName,
            bestStreak,
            bestStreakWord,
          };
        }

        // Reset the timer bar to 100% with no transition, then on the
        // next frame remove the .reset class so the 20s drain begins.
        // Bypass when the bar element doesn't exist (control-page render).
        function resetTimerBar() {
          const fill = document.getElementById('ov-bar-fill');
          if (!fill) return;
          fill.classList.add('reset');
          // Force a reflow so the browser registers the snap-to-100%
          // before we remove the class — without this, the transition
          // gets coalesced and the bar appears not to drain.
          fill.offsetWidth;
          fill.classList.remove('reset');
          fill.style.width = '0%';
        }

        // One-shot shake. Class self-removes on animationend.
        function triggerShake(intensity) {
          if (!isOverlay) return;
          const ov = document.getElementById('ov');
          if (!ov) return;
          const cls = intensity === 'hard' ? 'shake-hard' : 'shake-light';
          ov.classList.remove('shake-light', 'shake-hard');
          // Reflow so re-adding the same class restarts the animation
          // when consecutive demos hit the same tier.
          ov.offsetWidth;
          ov.classList.add(cls);
          const onEnd = () => {
            ov.classList.remove(cls);
            ov.removeEventListener('animationend', onEnd);
          };
          ov.addEventListener('animationend', onEnd);
        }

        // Arm the break transition. Cancels any pending timer first so
        // back-to-back demos don't queue stale break fires.
        function armBreakTimer() {
          if (breakTimer) clearTimeout(breakTimer);
          breakTimer = setTimeout(() => {
            breakTimer = null;
            // After the hold expires, fully fall through to idle. The
            // state machine in computeUiState handles "break" while
            // sinceDemo is in the hold window, then "idle" past it.
            // Schedule one final render at the end of the hold so the
            // crossfade kicks in.
            setTimeout(render, BREAK_HOLD_MS);
            render();
          }, COMBO_WINDOW_MS);
        }

        // ─── State ──────────────────────────────────────────────────
        // `totals[playerId] = { name, count }` — persists across runs via
        // the SDK's per-plugin store. The store is filesystem-backed JSON,
        // not localStorage, so totals survive a fresh dashboard install
        // and are visible to any other plugin that wants to read them.
        let totals = {};

        // `current[playerId] = { name, count }` — only the demos in the
        // active match. Reset whenever the match guid changes. In-memory
        // only; nothing meaningful to persist here.
        let current = {};
        let currentGuid = null;

        // ─── Combo state (volatile, per-match) ──────────────────────
        // `currentStreak` is 0 between combos and 1..∞ during an active
        // streak. `lastDemoAt` is performance.now() ms; the state machine
        // reads `now - lastDemoAt` against COMBO_WINDOW_MS to decide
        // active vs break vs idle. `bestStreak` and `bestStreakWord`
        // drive the BEST badge in idle. `breakTimer` is the setTimeout
        // handle that fires the break transition; we cancel and re-arm
        // it on every demo so streaks coalesce cleanly.
        let currentStreak = 0;
        let lastDemoAt = 0;
        let lastVictimName = '';
        let bestStreak = 0;
        let bestStreakWord = '';
        let breakTimer = null;

        function resetComboState() {
          currentStreak = 0;
          lastDemoAt = 0;
          lastVictimName = '';
          bestStreak = 0;
          bestStreakWord = '';
          if (breakTimer) {
            clearTimeout(breakTimer);
            breakTimer = null;
          }
        }

        // ─── Render ─────────────────────────────────────────────────
        // We rebuild innerHTML on each render. That's fine at this scale
        // (a couple dozen rows max) and the dejavu plugin shows what to
        // do when you outgrow it (a structural diff with a scaffoldKey).

        function totalCount() {
          let n = 0;
          for (const id in totals) n += totals[id].count;
          return n;
        }

        function esc(s) {
          const d = document.createElement('div');
          d.textContent = s == null ? '' : String(s);
          return d.innerHTML;
        }

        function emptyHtml(icon, msg) {
          return (
            '<div class="card-empty"><div class="em-icon">' +
            icon +
            '</div>' +
            msg +
            '</div>'
          );
        }

        function rowsHtml(entries, icon, emptyMsg) {
          if (!entries.length) return emptyHtml(icon, emptyMsg);
          return entries
            .map(
              ([_id, v]) =>
                '<div class="row">' +
                '<span class="row-name">' +
                esc(v.name) +
                '</span>' +
                '<span class="row-count"><span class="x">×</span>' +
                v.count +
                '</span>' +
                '</div>',
            )
            .join('');
        }

        function renderControl() {
          // Identity strip — read-only here. We don't own claim/clear UI;
          // the user manages identity in dejavu and demos just reflects it.
          const idVal = $('id-val');
          const idHint = $('id-hint');
          if (!RLT.me.id) {
            idVal.textContent = 'unclaimed';
            idVal.classList.add('empty');
            idHint.hidden = false;
          } else {
            const enc = RLT.encounters?.get(RLT.me.id);
            const name = enc ? enc.names[enc.names.length - 1] : 'Player';
            idVal.textContent = name;
            idVal.classList.remove('empty');
            idHint.hidden = true;
          }

          $('total').textContent = totalCount();

          const matchEntries = Object.entries(current).sort((a, b) => b[1].count - a[1].count);
          $('match-list').innerHTML = rowsHtml(
            matchEntries,
            '◇',
            currentGuid ? 'no demos yet — go hunting' : 'queue up to start tracking',
          );
          $('match-badge').textContent = currentGuid
            ? matchEntries.length + ' victims'
            : 'no match';

          const allEntries = Object.entries(totals)
            .sort((a, b) => b[1].count - a[1].count)
            .slice(0, 20);
          $('all-list').innerHTML = rowsHtml(allEntries, '◆', 'no demolitions yet');
          $('all-count').textContent = Object.keys(totals).length;
        }

        function renderOverlay() {
          const ov = $('ov');
          if (!ov) return;
          const ui = computeUiState(performance.now());

          // Top-level mode + tier classes drive everything CSS-side.
          ov.dataset.mode = ui.mode;
          // Strip any previous tier class, set the current one.
          ov.classList.remove(
            'tier-base',
            'tier-glow',
            'tier-hot',
            'tier-bloom',
            'tier-apocalypse',
            'is-break',
          );
          ov.classList.add(ui.tierClass);
          if (ui.mode === 'break') ov.classList.add('is-break');

          // ── Idle subtree ──
          $('ov-total').textContent = totalCount();

          // BEST badge — only when there's been a streak this match.
          const best = $('ov-best');
          if (ui.bestStreak >= 2) {
            best.hidden = false;
            $('ov-best-streak').textContent = 'x' + ui.bestStreak;
            $('ov-best-word').textContent = ui.bestStreakWord;
          } else {
            best.hidden = true;
          }

          const matchEntries = Object.entries(current)
            .sort((a, b) => b[1].count - a[1].count)
            .slice(0, 3);
          if (!matchEntries.length) {
            $('ov-list').innerHTML =
              '<div class="ov-empty">' +
              (currentGuid ? 'no demos yet' : 'waiting for match') +
              '</div>';
          } else {
            $('ov-list').innerHTML = matchEntries
              .map(
                ([_id, v], i) =>
                  '<div class="ov-row" style="--ov-i:' +
                  i +
                  '">' +
                  '<span class="c">' +
                  v.count +
                  '</span>' +
                  '<span class="n">' +
                  esc(v.name) +
                  '</span>' +
                  '</div>',
              )
              .join('');
          }

          // ── Active/break subtree ──
          $('ov-streak').textContent = 'x' + ui.streak;
          $('ov-word').textContent = ui.word || '';
          if (ui.mode === 'break') {
            $('ov-victim').textContent = 'STREAK ENDED';
          } else if (ui.victim) {
            $('ov-victim').textContent = '↳ ' + ui.victim;
          } else {
            $('ov-victim').textContent = '';
          }
        }

        // rAF batcher: many SDK callbacks can fire on the same frame
        // (StatfeedEvent + onTick + onMatch all in a single SSE flush).
        // Coalesce them so we only paint once per frame.
        let rafScheduled = false;
        function render() {
          if (rafScheduled) return;
          rafScheduled = true;
          requestAnimationFrame(() => {
            rafScheduled = false;
            if (isOverlay) renderOverlay();
            else renderControl();
          });
        }

        // ─── Plugin registration ────────────────────────────────────
        // The handle returned by register() exposes a per-plugin `store`
        // that's namespaced by manifest.name on disk. Use it for anything
        // you want to keep across restarts.
        const handle = RLT.plugin.register({
          // Demolitions only happen in-play. `whilePhase` filters event
          // delivery for us — handlers below won't fire in menus.
          whilePhase: ['live', 'replay', 'countdown', 'paused'],

          // init() runs synchronously at register-time, before any SSE
          // events fire. We wire the connection pill here (rather than in
          // ready(), which is async) so we don't miss the initial
          // 'connected' transition. We also seed from statusStable() once
          // — onStatusStable only fires on change, so a subscriber that
          // arrives after the SDK already connected would otherwise never
          // see the initial state. Overlay mode has nothing to do here:
          // the SDK's `hide_when_unfocused` manifest flag handles the
          // foreground-gating directly on <body>.
          init() {
            if (isOverlay) return;
            const c = $('conn');
            if (!c) return;
            const paint = (s) => {
              c.dataset.status = s;
              c.textContent = s === 'connected' ? 'live' : s;
            };
            paint(RLT.statusStable());
            RLT.onStatusStable(paint);
          },

          async ready() {
            // Hydrate persisted totals before the first paint. We use
            // store.getAll() rather than store.get('totals') because the
            // backend returns 404 for an unset key — the SDK swallows it
            // cleanly, but DevTools logs the failed request as a noisy
            // red error on every fresh install. getAll() always returns
            // 200 (with {} when nothing's stored), keeping the console
            // quiet on first run.
            try {
              const all = await handle.store.getAll();
              const stored = all && all.totals;
              if (stored && typeof stored === 'object') totals = stored;
            } catch (e) {
              console.error('[demos] failed to load totals:', e);
            }
            // Seed the current match if one is already in progress when
            // the plugin loads (e.g. user opened the dashboard mid-match).
            const m = RLT.match.current;
            if (m) currentGuid = m.guid;
            render();
          },

          // The Demolish event lives on the statfeed. mainTarget is the
          // attacker, secondaryTarget is the victim — see the SDK's
          // `events: { StatfeedEvent }` docs for the full payload shape.
          events: {
            StatfeedEvent(s) {
              if (s.eventName !== 'Demolish') return;
              const attacker = s.mainTarget;
              const victim = s.secondaryTarget;
              if (!attacker || !victim) return;

              // Count only YOUR demos. `isMe` is set by the SDK from the
              // claimed identity (RLT.me.id). If the user hasn't claimed
              // an identity, nothing in the lobby is "me" and we silently
              // ignore — the control page nudges them to fix that.
              if (!attacker.isMe) return;

              const vid = victim.id;
              const vname = victim.name || 'Player';

              if (!current[vid]) current[vid] = { name: vname, count: 0 };
              current[vid].count += 1;
              current[vid].name = vname;

              if (!totals[vid]) totals[vid] = { name: vname, count: 0 };
              totals[vid].count += 1;
              totals[vid].name = vname;

              // ─── Combo ───
              const now = performance.now();
              const sinceLast = lastDemoAt ? now - lastDemoAt : Infinity;
              if (sinceLast <= COMBO_WINDOW_MS) {
                // Within window — extend the streak.
                currentStreak += 1;
              } else {
                // Outside window OR first demo — start fresh at 1.
                // (A demo during the break hold also lands here because
                // BREAK_HOLD_MS pushes sinceLast past COMBO_WINDOW_MS.)
                currentStreak = 1;
              }
              lastDemoAt = now;
              lastVictimName = vname;

              // Track best-of-match for the BEST badge.
              if (currentStreak > bestStreak) {
                bestStreak = currentStreak;
                const t = tierFor(currentStreak);
                bestStreakWord = t ? t.word : '';
              }

              // Visual feedback at tier-hot+ — shake intensity scales.
              const tier = tierFor(currentStreak);
              if (tier && (tier.cls === 'tier-hot' || tier.cls === 'tier-bloom')) {
                triggerShake('light');
              } else if (tier && tier.cls === 'tier-apocalypse') {
                triggerShake('hard');
              }

              // Reset the drain bar and arm a fresh break timer.
              resetTimerBar();
              armBreakTimer();

              // Fire-and-forget save; the store debounces so rapid demos
              // (a triple-demo from a kickoff scrum) coalesce into one
              // disk write.
              handle.store.set('totals', totals).catch((e) => {
                console.error('[demos] save failed:', e);
              });

              render();
            },
          },

          // Match boundary — guid changes on every new match. Reset the
          // per-match counters here. (We don't reset on phase changes,
          // because replay/paused are still the same match.)
          onMatch(m) {
            const g = m ? m.guid : null;
            if (g !== currentGuid) {
              currentGuid = g;
              current = {};
              resetComboState();
            }
            render();
          },

          // Identity changed — re-render so the "claim your identity"
          // banner appears or disappears.
          onIdentity: render,
        });

      })();
    </script>
  </body>
</html>
