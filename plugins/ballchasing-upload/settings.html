<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ballchasing Upload — Settings</title>
    <link rel="stylesheet" href="/sdk.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/sdk.js" data-plugin="ballchasing-upload" data-view="settings"></script>
  </head>
  <body>
    <section class="settings">
      <h2>Ballchasing Upload</h2>

      <div class="field">
        <label class="field-label" for="apiKey">API key</label>
        <input id="apiKey" type="password" autocomplete="off"
               placeholder="paste your ballchasing.com API key" />
      </div>

      <div class="field">
        <span class="field-label">Visibility</span>
        <div class="radio-row">
          <label><input type="radio" name="visibility" value="public" /> Public</label>
          <label><input type="radio" name="visibility" value="unlisted" /> Unlisted</label>
          <label><input type="radio" name="visibility" value="private" checked /> Private</label>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="group">Group ID (optional)</label>
        <input id="group" type="text" autocomplete="off"
               placeholder="leave empty for no group" />
      </div>

      <div class="actions">
        <button class="btn primary" id="save" type="button">Save</button>
        <button class="btn" id="test" type="button">Test connection</button>
      </div>
      <div id="test-result" class="test-result"></div>
    </section>

    <script>window.__rlt_view = "settings";</script>
    <script src="app.js"></script>
  </body>
</html>
