<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ballchasing Upload — Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Ballchasing Upload</h1>

  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="paste your ballchasing.com API key">

  <label>Visibility</label>
  <div class="radios">
    <label><input type="radio" name="visibility" value="public"> Public</label>
    <label><input type="radio" name="visibility" value="unlisted"> Unlisted</label>
    <label><input type="radio" name="visibility" value="private" checked> Private</label>
  </div>

  <label for="group">Group ID (optional)</label>
  <input id="group" type="text" autocomplete="off" placeholder="leave empty for no group">

  <div style="margin-top: 16px; display: flex; gap: 8px;">
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
  </div>
  <div id="test-result" class="test-result"></div>

  <script src="/sdk.js" data-plugin="ballchasing-upload" data-view="settings"></script>
  <script>window.__rlt_view = "settings";</script>
  <script src="app.js"></script>
</body>
</html>
