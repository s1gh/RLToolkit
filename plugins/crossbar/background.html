<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crossbar Sound (background)</title>
    <script src="/sdk.js" data-plugin="crossbar" data-view="background"></script>
  </head>
  <body>
    <!-- Hidden iframe loaded by the launcher. Plays a sound effect on
         _CrossbarHit. Runs whether or not the user has the overlay
         shown over the game or an OBS browser source open — the
         launcher is the only requirement. -->
    <script src="./shared.js"></script>
    <script>
      (function () {
        const DEBOUNCE_MS = 250;
        let lastHitAt = 0;

        RLT.plugin.register({
          name: 'crossbar',
          events: {
            async _CrossbarHit() {
              const now =
                typeof performance !== 'undefined' && performance.now
                  ? performance.now()
                  : Date.now();
              if (now - lastHitAt < DEBOUNCE_MS) return;
              lastHitAt = now;
              const cfg = await Crossbar.readConfig();
              if (!cfg.playInReplays && RLT.match.state.phase === 'replay') return;
              Crossbar.playSound(cfg);
            },
          },
        });
      })();
    </script>
  </body>
</html>
