<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello World — Settings</title>
    <link rel="stylesheet" href="/sdk.css" />
    <script src="/sdk.js" data-plugin="hello-world" data-view="settings"></script>
    <style>
      /* Layout: centered column inside the settings modal iframe.
         All breathing room lives on .hw-set, NOT on body. sdk.css gives
         body { height: 100%; min-height: 100vh; } with the default
         content-box sizing — any padding or margin on body sits
         on top of that, producing 100vh+padding total height and an
         unwanted scrollbar even with tiny content. */
      .hw-set {
        max-width: 520px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hw-row {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .hw-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="hw-set">
      <div class="rlt-card">
        <label class="hw-row">
          <input type="checkbox" id="own-goals" />
          Also log own goals
        </label>
      </div>

      <div class="hw-actions">
        <button id="cancel" class="rlt-btn" type="button">Close</button>
        <button id="save" class="rlt-btn rlt-btn-primary" type="button">Save</button>
      </div>
    </div>

    <script src="./shared.js"></script>
    <script>
      RLT.plugin.register({
        init() {
          const checkbox = document.getElementById('own-goals');

          // init is sync, so wrap the await in an inline async IIFE
          // to hydrate the checkbox.
          (async () => {
            const cfg = await HW.readConfig();
            checkbox.checked = cfg.logOwnGoals;
          })();

          document.getElementById('save').onclick = async () => {
            await HW.writeConfig({ logOwnGoals: checkbox.checked });
            // The overlay + dashboard both subscribed to
            // store.onChange('config'), so this write broadcasts
            // _StoreChanged → their refreshConfig handlers fire →
            // caches update. No extra signaling needed.
            RLT.settings.close();
          };

          document.getElementById('cancel').onclick = () => RLT.settings.close();
        },
      });
    </script>
  </body>
</html>
